<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labirinto do Robô — Overcast Realm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8ec;
    --sky:#5ec9ff;
    --sky-dark:#2fa8ec;
    --sun:#ffc93c;
    --coral:#ff7a6b;
    --mint:#3ddc97;
    --grape:#a06bff;
    --gold:#e8a800;
    --ink:#3a2b52;
    --ink-soft:#6b5b8a;
    --card:#ffffff;
    --card-edge:#f0e4d0;
    --ok:#2bb673;
    --ok-bg:#e3fbf0;
    --bad:#ff5c5c;
    --bad-bg:#ffecec;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 6%, #ffe9b8 0%, transparent 40%),
      radial-gradient(circle at 95% 15%, #bfeaff 0%, transparent 38%),
      radial-gradient(circle at 90% 95%, #d8f5e6 0%, transparent 40%),
      var(--bg);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    font-size:18px;
    min-height:100vh;
    padding:16px 12px 60px;
  }
  .wrap{max-width:980px;margin:0 auto;}

  .back-home {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
    background: var(--card);
    border: 3px solid var(--card-edge);
    border-radius: 999px;
    padding: 8px 16px;
    text-decoration: none;
    box-shadow: 0 4px 0 var(--card-edge);
  }
  .back-home:hover { color: var(--sky-dark); }
  .back-row { display:flex; flex-wrap:wrap; gap:10px; margin-bottom: 14px; }

  header{ text-align:center; margin-bottom:14px; }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:28px;
    line-height:1.15;
    margin:0;
    color:var(--sky-dark);
  }

  .legend{
    display:flex;
    justify-content:center;
    gap:18px;
    margin:10px 0 4px;
    flex-wrap:wrap;
  }
  .legend .li{
    display:flex; align-items:center; gap:5px;
    font-size:22px;
  }
  .legend .li small{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:11px;
    color:var(--ink-soft);
  }

  .levels-strip{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    margin:14px auto 18px;
    max-width:760px;
  }
  .level-dot{
    width:36px; height:36px;
    border-radius:50%;
    border:3px solid var(--card-edge);
    background:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .level-dot.active{ border-color:var(--sky-dark); color:var(--sky-dark); background:#e3f4ff; transform:scale(1.12); }
  .level-dot.done{ background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .level-dot.locked{ background:#f2f0f7; border-color:#e3ddef; color:#c9c1db; cursor:default; font-size:15px; }

  .game-card{
    background:var(--card);
    border:3px solid var(--card-edge);
    border-radius:24px;
    box-shadow:0 8px 0 var(--card-edge);
    padding:20px;
  }

  .stage{
    display:flex;
    flex-direction:column;
    gap:18px;
    align-items:center;
  }
  .stage-top{ display:flex; flex-direction:column; align-items:center; }

  #maze{
    display:grid;
    gap:4px;
    background:#e7f5ff;
    border:4px solid #cfeaff;
    border-radius:16px;
    padding:8px;
  }
  .cell{
    width:52px; height:52px;
    border-radius:10px;
    background:#fbfdff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    position:relative;
  }
  .cell.tree{ background:#e6f9ee; }
  .cell.rock{ background:#f4efe4; }
  .cell.goal{ background:#fff6da; }
  .cell.char{ background:#dff1ff; }
  .cell .robot{ font-size:26px; transition:transform .15s; }
  .cell .coin-mark{ position:absolute; font-size:14px; bottom:2px; right:2px; }
  .cell.bump .robot{ animation:bump .3s; }
  @keyframes bump{
    0%{transform:scale(1);}
    40%{transform:scale(0.8) rotate(-10deg);}
    100%{transform:scale(1);}
  }
  .cell.hop .robot{ animation:hop .35s; }
  @keyframes hop{
    0%{transform:translateY(0);}
    40%{transform:translateY(-14px) scale(1.1);}
    100%{transform:translateY(0);}
  }
  .cell.win .robot{ animation:win .6s; }
  @keyframes win{
    0%{transform:scale(1) rotate(0);}
    50%{transform:scale(1.5) rotate(20deg);}
    100%{transform:scale(1) rotate(0);}
  }
  .cell.sparkle .coin-mark{ animation:sparkle .4s; }
  @keyframes sparkle{
    0%{transform:scale(1); opacity:1;}
    100%{transform:scale(2); opacity:0;}
  }

  .coin-status{
    display:flex; align-items:center; justify-content:center; gap:4px;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:15px;
    color:var(--gold);
    margin-top:8px;
  }

  .controls{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }

  .palette{
    display:grid;
    grid-template-columns:repeat(3, 52px);
    gap:8px;
    justify-content:center;
    background:#f7f3ff;
    border:2px dashed #e3d9fb;
    border-radius:16px;
    padding:10px;
  }
  .palette-block{
    width:52px; height:52px;
    font-size:24px;
    border:3px solid var(--sky-dark);
    background:#fff;
    border-radius:14px;
    cursor:grab;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 0 var(--sky-dark);
    user-select:none;
  }
  .palette-block[data-type="coin"]{ border-color:var(--gold); box-shadow:0 4px 0 var(--gold); }
  .palette-block[data-type="jump"]{ border-color:var(--grape); box-shadow:0 4px 0 var(--grape); }
  .palette-block.dragging{ opacity:.35; }
  .palette-block:active{ cursor:grabbing; }

  .program-tray{
    min-height:60px;
    width:100%;
    border:3px dashed var(--card-edge);
    border-radius:14px;
    background:#fffaf1;
    padding:8px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-content:flex-start;
    transition:background .12s, border-color .12s;
  }
  .program-tray.dragover{ background:#eef7ff; border-color:var(--sky-dark); border-style:solid; }
  .program-tray .step{
    width:34px; height:34px;
    border-radius:9px;
    background:#fff;
    border:2px solid var(--sky-dark);
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    cursor:pointer;
    position:relative;
  }
  .program-tray .step[data-type="coin"]{ border-color:var(--gold); }
  .program-tray .step[data-type="jump"]{ border-color:var(--grape); }
  .program-tray .step.running{ background:var(--sun); border-color:#e0a800; }
  .program-tray .step.ok{ background:var(--ok-bg); border-color:var(--ok); }
  .program-tray .step.fail{ background:var(--bad-bg); border-color:var(--bad); border-width:3px; animation:shake .4s; }
  .program-tray .step.fail:after{
    content:"❌";
    position:absolute; top:-12px; right:-8px;
    font-size:14px;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-4px); }
    40%{ transform:translateX(4px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
  }
  .program-tray .empty-hint{ font-size:22px; padding:8px; opacity:.35; }

  .action-buttons{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  button.big-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:14px;
    border:none;
    border-radius:999px;
    padding:10px 16px;
    cursor:pointer;
    color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .btn-run{ background:var(--mint); }
  .btn-reset{ background:var(--sky-dark); }
  .btn-clear{ background:var(--coral); }
  .btn-next{ background:var(--grape); display:none; }
  button.big-btn:active{ transform:translateY(2px); box-shadow:none; }
  button.big-btn:disabled{ opacity:.5; cursor:default; }

  .msg{
    font-size:26px;
    text-align:center;
    min-height:32px;
  }

  .win-overlay{
    position:fixed; inset:0;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(58,43,82,0.55);
    z-index:999;
  }
  .win-overlay.show{ display:flex; }
  .win-box{
    background:#fff;
    border-radius:28px;
    padding:32px 40px;
    text-align:center;
    box-shadow:0 10px 0 var(--card-edge);
  }
  .win-box .big-emoji{ font-size:64px; }
  .win-box button{ margin-top:14px; }

  @media (max-width:640px){
    h1{font-size:22px;}
    .cell{width:42px;height:42px;font-size:20px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="back-row">
    <a href="./index.html" class="back-home">← Voltar</a>
  </div>

  <header>
    <h1>🤖 → ⭐</h1>
  </header>

  <div class="legend">
    <div class="li">⬆️⬇️⬅️➡️ <small>ANDAR</small></div>
    <div class="li">🪙 <small>PEGAR</small></div>
    <div class="li">🦘 <small>PULAR</small></div>
  </div>

  <div class="levels-strip" id="levels-strip"></div>

  <div class="game-card">
    <div class="stage">
      <div class="stage-top">
        <div id="maze"></div>
        <div class="coin-status" id="coin-status"></div>
      </div>

      <div class="controls">
        <div class="palette" id="palette">
          <div class="palette-block" draggable="true" data-type="move" data-dir="up">⬆️</div>
          <div class="palette-block" draggable="true" data-type="move" data-dir="left">⬅️</div>
          <div class="palette-block" draggable="true" data-type="move" data-dir="down">⬇️</div>
          <div class="palette-block" draggable="true" data-type="move" data-dir="right">➡️</div>
          <div class="palette-block" draggable="true" data-type="coin">🪙</div>
          <div class="palette-block" draggable="true" data-type="jump">🦘</div>
        </div>

        <div class="program-tray" id="tray"></div>

        <div class="action-buttons">
          <button class="big-btn btn-run" id="btn-run" onclick="runProgram()">▶️ Play</button>
          <button class="big-btn btn-reset" onclick="reiniciarTentativa()">🔁 Reiniciar</button>
          <button class="big-btn btn-clear" onclick="clearProgram()">🗑️ Limpar</button>
          <button class="big-btn btn-next" id="btn-next-inline" onclick="irProximaFase()">➡️ Próximo</button>
        </div>

        <div class="msg" id="msg"></div>
      </div>
    </div>
  </div>

</div>

<div class="win-overlay" id="win-overlay">
  <div class="win-box">
    <div class="big-emoji">🎉⭐🎉</div>
    <button class="big-btn btn-next" style="display:inline-flex;" onclick="closeWinOverlay()" id="win-btn">➡️ Próximo</button>
  </div>
</div>

<script>
// x = coluna (0 = esquerda), y = linha (0 = topo)
// walls = árvore (bloqueia sempre) · rocks = pedra (precisa pular) · coins = moedas a coletar
const levels = [
  {cols:3, rows:1, start:[0,0], goal:[2,0]},
  {cols:1, rows:3, start:[0,0], goal:[0,2]},
  {cols:3, rows:1, start:[2,0], goal:[0,0]},
  {cols:3, rows:3, start:[0,0], goal:[2,2]},
  {cols:4, rows:3, start:[0,0], goal:[3,2]},

  {cols:4, rows:1, start:[0,0], goal:[3,0], coins:[[2,0]]},
  {cols:1, rows:4, start:[0,0], goal:[0,3], coins:[[0,1]]},
  {cols:4, rows:3, start:[0,0], goal:[3,2], coins:[[3,0]], walls:[[0,2]]},
  {cols:4, rows:4, start:[0,0], goal:[3,3], coins:[[3,0],[3,2]], walls:[[0,3]]},
  {cols:5, rows:1, start:[0,0], goal:[4,0], coins:[[1,0],[3,0]]},

  {cols:4, rows:1, start:[0,0], goal:[3,0], rocks:[[2,0]]},
  {cols:1, rows:4, start:[0,0], goal:[0,3], rocks:[[0,2]]},
  {cols:5, rows:1, start:[0,0], goal:[4,0], rocks:[[2,0]], coins:[[3,0]]},
  {cols:1, rows:5, start:[0,0], goal:[0,4], rocks:[[0,2]], coins:[[0,3]]},
  {cols:6, rows:1, start:[0,0], goal:[5,0], rocks:[[2,0],[4,0]]},

  {cols:4, rows:4, start:[0,0], goal:[3,3], rocks:[[3,1]], coins:[[3,0]], walls:[[1,2]]},
  {cols:5, rows:4, start:[0,0], goal:[4,3], rocks:[[4,2]], coins:[[4,0],[4,3]], walls:[[1,1]]},
  {cols:6, rows:4, start:[0,0], goal:[5,3], rocks:[[5,2]], coins:[[1,0],[5,3]], walls:[[2,1],[2,2]]},
  {cols:5, rows:4, start:[0,0], goal:[4,0], walls:[[2,0],[2,1],[2,2]]},
  {cols:5, rows:4, start:[0,0], goal:[4,3], rocks:[[2,3]], coins:[[0,3],[4,3]], walls:[[2,0],[2,1]]},

  {cols:6, rows:5, start:[0,0], goal:[5,4], coins:[[5,0],[5,4]], walls:[[2,2]]},
  {cols:6, rows:5, start:[0,0], goal:[5,4], rocks:[[5,2]], coins:[[5,4]], walls:[]},
  {cols:7, rows:1, start:[0,0], goal:[6,0], rocks:[[2,0],[5,0]]},
  {cols:1, rows:7, start:[0,0], goal:[0,6], rocks:[[0,2],[0,5]]},
  {cols:6, rows:5, start:[0,0], goal:[5,4], rocks:[[5,2]], coins:[[5,0],[5,4]], walls:[[1,3],[3,3]]},
  {cols:7, rows:5, start:[0,0], goal:[6,4], walls:[[3,0],[3,1],[3,2],[3,3]]},
  {cols:7, rows:1, start:[0,0], goal:[6,0], rocks:[[5,0]], coins:[[6,0]], walls:[[3,0]]},
  {cols:6, rows:6, start:[0,0], goal:[5,5], rocks:[[4,5]], coins:[[0,5],[5,5]], walls:[[2,0],[2,1],[2,2],[2,3],[2,4]]},
  {cols:7, rows:6, start:[0,0], goal:[6,5], walls:[[3,1],[3,2],[1,4]]},
  {cols:7, rows:6, start:[0,0], goal:[6,5], rocks:[[3,5]], coins:[[0,5],[6,5]], walls:[[3,1],[3,2]]}
];

const STORAGE_KEY = 'overcast_labirinto_v1';
let currentLevel = 0;
let program = [];
let pos = [0,0];
let lastDir = null;
let coinsCollected = new Set();
let completed = new Set();

const DIR_ICON = {up:'⬆️', down:'⬇️', left:'⬅️', right:'➡️'};
const DELTA = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

function saveProgress(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    completed:[...completed],
    lastLevel: currentLevel
  }));
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    completed = new Set(data.completed || []);
    if(typeof data.lastLevel === 'number') currentLevel = data.lastLevel;
  }catch(e){}
}
function maxUnlocked(){
  let n = 0;
  while(completed.has(n)) n++;
  return Math.min(n, levels.length - 1);
}

function buildLevelsStrip(){
  const strip = document.getElementById('levels-strip');
  const unlocked = maxUnlocked();
  strip.innerHTML = levels.map((_, i) => {
    const isLocked = i > unlocked;
    return `<div class="level-dot ${isLocked ? 'locked' : ''}" id="dot-${i}" onclick="${isLocked ? '' : `goToLevel(${i})`}">${isLocked ? '🔒' : (i+1)}</div>`;
  }).join('');
  updateDots();
}

function updateDots(){
  levels.forEach((_, i) => {
    const dot = document.getElementById('dot-'+i);
    if(!dot) return;
    dot.classList.toggle('active', i === currentLevel);
    dot.classList.toggle('done', completed.has(i));
  });
}

function goToLevel(i){
  if(i > maxUnlocked()) return;
  currentLevel = i;
  saveProgress();
  loadLevel();
}

function levelData(){ return levels[currentLevel]; }

function loadLevel(){
  const lvl = levelData();
  pos = [...lvl.start];
  lastDir = null;
  program = [];
  coinsCollected = new Set();
  document.getElementById('msg').textContent = '';
  document.getElementById('btn-next-inline').style.display = 'none';
  renderMaze();
  renderTray();
  renderCoinStatus();
  updateDots();
}

function isTree(x,y){ return (levelData().walls||[]).some(w=>w[0]===x&&w[1]===y); }
function isRock(x,y){ return (levelData().rocks||[]).some(w=>w[0]===x&&w[1]===y); }
function isCoinCell(x,y){ return (levelData().coins||[]).some(c=>c[0]===x&&c[1]===y); }
function coinKey(x,y){ return x+','+y; }

function renderMaze(){
  const lvl = levelData();
  const maze = document.getElementById('maze');
  maze.style.gridTemplateColumns = `repeat(${lvl.cols}, 52px)`;
  maze.style.gridTemplateRows = `repeat(${lvl.rows}, 52px)`;

  let html = '';
  for(let y=0; y<lvl.rows; y++){
    for(let x=0; x<lvl.cols; x++){
      const tree = isTree(x,y);
      const rock = isRock(x,y);
      const isGoal = x===lvl.goal[0] && y===lvl.goal[1];
      const isChar = x===pos[0] && y===pos[1];
      const hasCoin = isCoinCell(x,y) && !coinsCollected.has(coinKey(x,y));

      let cls = 'cell';
      if(tree) cls += ' tree';
      else if(rock) cls += ' rock';
      else if(isGoal && !isChar) cls += ' goal';
      if(isChar) cls += ' char';

      let content = '';
      if(tree) content = '🌳';
      else if(rock) content = '🪨';
      else if(isChar) content = '<span class="robot" id="robot">🤖</span>';
      else if(isGoal) content = '⭐';

      if(hasCoin && !isChar) content += '<span class="coin-mark">🪙</span>';

      html += `<div class="${cls}" id="cell-${x}-${y}">${content}</div>`;
    }
  }
  maze.innerHTML = html;
}

function renderCoinStatus(){
  const lvl = levelData();
  const total = (lvl.coins || []).length;
  const el = document.getElementById('coin-status');
  if(total === 0){ el.innerHTML = ''; return; }
  el.innerHTML = `🪙 ${coinsCollected.size}/${total}`;
}

function renderTray(){
  const tray = document.getElementById('tray');
  if(program.length === 0){
    tray.innerHTML = '<span class="empty-hint">🖐️</span>';
    return;
  }
  tray.innerHTML = program.map((step, i) => {
    const icon = step.type === 'move' ? DIR_ICON[step.dir] : (step.type === 'jump' ? '🦘' : '🪙');
    return `<div class="step" data-type="${step.type}" id="step-${i}" onclick="removeStep(${i})">${icon}</div>`;
  }).join('');
}

function addStep(step){
  if(program.length >= 30) return;
  program.push(step);
  renderTray();
}
function removeStep(i){
  program.splice(i,1);
  renderTray();
}
function undoStep(){
  program.pop();
  renderTray();
}
function clearProgram(){
  program = [];
  renderTray();
  reiniciarTentativa();
}
function reiniciarTentativa(){
  const lvl = levelData();
  pos = [...lvl.start];
  lastDir = null;
  coinsCollected = new Set();
  document.getElementById('msg').textContent = '';
  document.getElementById('btn-next-inline').style.display = 'none';
  document.querySelectorAll('.program-tray .step').forEach(s=>s.classList.remove('running','ok','fail'));
  renderMaze();
  renderCoinStatus();
}

let draggedStep = null;

document.querySelectorAll('.palette-block').forEach(block=>{
  block.addEventListener('dragstart', e=>{
    draggedStep = block.dataset.type === 'move'
      ? { type:'move', dir: block.dataset.dir }
      : { type: block.dataset.type };
    block.classList.add('dragging');
  });
  block.addEventListener('dragend', ()=>block.classList.remove('dragging'));
});

const trayEl = document.getElementById('tray');
trayEl.addEventListener('dragover', e=>{
  e.preventDefault();
  trayEl.classList.add('dragover');
});
trayEl.addEventListener('dragleave', ()=>trayEl.classList.remove('dragover'));
trayEl.addEventListener('drop', e=>{
  e.preventDefault();
  trayEl.classList.remove('dragover');
  if(draggedStep) addStep(draggedStep);
  draggedStep = null;
});

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function runProgram(){
  const lvl = levelData();
  const runBtn = document.getElementById('btn-run');
  const msg = document.getElementById('msg');
  msg.textContent = '';
  runBtn.disabled = true;

  pos = [...lvl.start];
  lastDir = null;
  coinsCollected = new Set();
  renderMaze();
  renderCoinStatus();
  await sleep(250);

  function checkWin(){
    const total = (lvl.coins || []).length;
    return pos[0]===lvl.goal[0] && pos[1]===lvl.goal[1] && coinsCollected.size >= total;
  }

  for(let i=0; i<program.length; i++){
    document.querySelectorAll('.program-tray .step').forEach(s=>s.classList.remove('running'));
    const stepEl = document.getElementById('step-'+i);
    if(stepEl) stepEl.classList.add('running');
    const step = program[i];

    if(step.type === 'move'){
      lastDir = step.dir;
      const [dx,dy] = DELTA[step.dir];
      const nx = pos[0]+dx, ny = pos[1]+dy;
      const outOfBounds = nx<0 || ny<0 || nx>=lvl.cols || ny>=lvl.rows;

      if(outOfBounds || isTree(nx,ny)){
        const cell = document.getElementById(`cell-${pos[0]}-${pos[1]}`);
        if(cell) cell.classList.add('bump');
        if(stepEl) stepEl.classList.add('fail');
        msg.textContent = '❌ Esse bloco bateu na parede';
        runBtn.disabled = false;
        return;
      }
      if(isRock(nx,ny)){
        const cell = document.getElementById(`cell-${pos[0]}-${pos[1]}`);
        if(cell) cell.classList.add('bump');
        await sleep(300);
      } else {
        pos = [nx, ny];
        renderMaze();
        if(stepEl) stepEl.classList.add('ok');
        await sleep(350);
      }
    }

    else if(step.type === 'jump'){
      if(!lastDir){
        if(stepEl) stepEl.classList.add('fail');
        msg.textContent = '❌ Esse bloco não sabe pra onde pular';
        await sleep(250);
        runBtn.disabled = false;
        return;
      } else {
        const [dx,dy] = DELTA[lastDir];
        const nx = pos[0]+dx*2, ny = pos[1]+dy*2;
        const outOfBounds = nx<0 || ny<0 || nx>=lvl.cols || ny>=lvl.rows;
        if(outOfBounds || isTree(nx,ny) || isRock(nx,ny)){
          const cell = document.getElementById(`cell-${pos[0]}-${pos[1]}`);
          if(cell) cell.classList.add('bump');
          if(stepEl) stepEl.classList.add('fail');
          msg.textContent = '❌ Esse bloco pulou pro lugar errado';
          runBtn.disabled = false;
          return;
        }
        pos = [nx, ny];
        renderMaze();
        const cell = document.getElementById(`cell-${pos[0]}-${pos[1]}`);
        if(cell) cell.classList.add('hop');
        if(stepEl) stepEl.classList.add('ok');
        await sleep(400);
      }
    }

    else if(step.type === 'coin'){
      if(isCoinCell(pos[0], pos[1]) && !coinsCollected.has(coinKey(pos[0], pos[1]))){
        coinsCollected.add(coinKey(pos[0], pos[1]));
        renderCoinStatus();
        const cell = document.getElementById(`cell-${pos[0]}-${pos[1]}`);
        if(cell) cell.classList.add('sparkle');
        if(stepEl) stepEl.classList.add('ok');
      }
      await sleep(280);
    }

    if(checkWin()){
      const cell = document.getElementById(`cell-${pos[0]}-${pos[1]}`);
      if(cell) cell.classList.add('win');
      completed.add(currentLevel);
      saveProgress();
      buildLevelsStrip();
      msg.textContent = '🎉 Você chegou!';
      document.getElementById('btn-next-inline').style.display = 'inline-flex';
      await sleep(300);
      showWinOverlay();
      runBtn.disabled = false;
      return;
    }
  }

  const total = (lvl.coins || []).length;
  msg.textContent = coinsCollected.size < total ? '🪙 Falta pegar moeda' : '🤔 Quase! Faltou chegar na estrela';
  runBtn.disabled = false;
}

function showWinOverlay(){
  const isLast = currentLevel >= levels.length - 1;
  document.getElementById('win-btn').innerHTML = isLast ? '🏆 Fim!' : '➡️ Próximo';
  document.getElementById('win-overlay').classList.add('show');
}
function irProximaFase(){
  closeWinOverlay();
}
function closeWinOverlay(){
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('btn-next-inline').style.display = 'none';
  if(currentLevel < levels.length - 1){
    currentLevel++;
    saveProgress();
    loadLevel();
  } else {
    loadLevel();
  }
}

loadProgress();
if(currentLevel > maxUnlocked()) currentLevel = maxUnlocked();
buildLevelsStrip();
loadLevel();
</script>
</body>
</html>
