<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Herói dos Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --p:clamp(3px,.55vmin,5px);              /* 1 "pixel" de interface */
  --ink:#2b1a10; --wood:#6b4428; --wood2:#583620; --woodL:#c98b4f; --woodLL:#e7b47a; --woodD:#8f5a30;
  --parch:#ead3a2; --parchL:#f7e9c6; --parchD:#c9a46b;
  --red:#d9473a; --gold:#f2c14e; --green:#7fc464;
  --fs-s:clamp(12px,2.6vmin,18px);
  --fs-q:clamp(30px,9vmin,70px);
  --fs-btn:clamp(28px,8vmin,60px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1a100a;color:var(--ink);font-family:'Pixelify Sans',ui-monospace,monospace;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;max-width:1500px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--wood)}
svg{display:block;shape-rendering:crispEdges}

/* molduras em pixel: borda escura + cantos recortados + luz/sombra interna */
.px{border:var(--p) solid var(--ink);
  clip-path:polygon(0 var(--p),var(--p) var(--p),var(--p) 0,calc(100% - var(--p)) 0,calc(100% - var(--p)) var(--p),100% var(--p),100% calc(100% - var(--p)),calc(100% - var(--p)) calc(100% - var(--p)),calc(100% - var(--p)) 100%,var(--p) 100%,var(--p) calc(100% - var(--p)),0 calc(100% - var(--p)))}
.parch{background:var(--parch);box-shadow:inset var(--p) var(--p) 0 var(--parchL),inset calc(-1*var(--p)) calc(-1*var(--p)) 0 var(--parchD)}

/* cena */
.scene{position:relative;flex:1 1 auto;min-height:150px}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:calc(var(--p)*3);pointer-events:none}
.hearts{display:flex;gap:calc(var(--p)*.6)}
.coins{display:flex;align-items:center;gap:6px;font-weight:700;font-size:var(--fs-s);color:#fff7e0;text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink)}
.ribbon{flex:0 1 46%;min-width:150px;padding:calc(var(--p)*1.6) calc(var(--p)*3)}
.ribbon .t{display:flex;justify-content:space-between;font-size:calc(var(--fs-s)*.82);font-weight:600;margin-bottom:calc(var(--p)*1.4)}
.trail{position:relative;height:calc(var(--p)*5);margin:0 calc(var(--p)*2)}
.trail::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:var(--p) dashed #9a7442}
.trail .n{position:absolute;top:50%;transform:translate(-50%,-50%)}
.trail .me{position:absolute;top:50%;transform:translate(-50%,-62%);transition:left .12s linear;z-index:2}
#fb{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:700;font-size:clamp(22px,6vmin,48px);pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s;
  text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),3px 3px var(--ink),-3px 3px var(--ink),3px -3px var(--ink),-3px -3px var(--ink)}
#fb.on{opacity:1;transform:none}

/* painel de madeira */
.panel{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--p)*3);padding:calc(var(--p)*4);border-top:var(--p) solid var(--ink);
  background:repeating-linear-gradient(0deg,var(--wood) 0 calc(var(--p)*13),var(--wood2) calc(var(--p)*13) calc(var(--p)*14))}
@media (orientation:landscape){
  #app{flex-direction:row}
  .panel{flex:0 0 38%;max-width:540px;border-top:0;border-left:var(--p) solid var(--ink);
    background:repeating-linear-gradient(90deg,var(--wood) 0 calc(var(--p)*16),var(--wood2) calc(var(--p)*16) calc(var(--p)*17))}
}
.scroll{padding:calc(var(--p)*2.4) calc(var(--p)*3.5) calc(var(--p)*3)}
.scroll .t{display:flex;justify-content:space-between;font-size:var(--fs-s);font-weight:600;color:#6d4a2a}
#pergunta,.grid .btn,.coins{font-family:'Fredoka',system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#pergunta{text-align:center;font-size:var(--fs-q);font-weight:700;line-height:1.25;padding:calc(var(--p)*1.5) 0;min-height:1.25em}
.timer{display:flex;align-items:center;gap:calc(var(--p)*2)}
.slot{flex:1;height:calc(var(--p)*4);background:#4a2f1c;border:var(--p) solid var(--ink)}
.slot i{display:block;height:100%;width:100%;background:var(--green)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--p)*3);transition:opacity .2s}
.grid.off{opacity:.35;pointer-events:none}
.btn{font:inherit;font-weight:700;color:var(--ink);background:var(--woodL);cursor:pointer;
  box-shadow:inset var(--p) var(--p) 0 var(--woodLL),inset calc(-1*var(--p)) calc(-1*var(--p)*2) 0 var(--woodD)}
.grid .btn{font-size:var(--fs-btn);font-weight:700;padding:clamp(10px,3.2vmin,28px) 0}
.btn:active{transform:translateY(var(--p));box-shadow:inset var(--p) var(--p) 0 var(--woodD)}
@media (hover:hover){.btn:hover:not(:disabled){background:#d89a5c}}
.btn.certo{background:var(--green);box-shadow:inset var(--p) var(--p) 0 #a8e08e,inset calc(-1*var(--p)) calc(-1*var(--p)*2) 0 #4f8f3a}
.btn.errado{background:#8a4a3c;color:#4a2018;box-shadow:none;opacity:.6}

/* telas */
.tela{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--p)*5);background:rgba(26,16,10,.45);z-index:5;overflow:auto}
.card{width:100%;max-width:470px;padding:calc(var(--p)*6) calc(var(--p)*6);display:flex;flex-direction:column;gap:calc(var(--p)*3);text-align:center}
.card h1{font-size:clamp(28px,7vmin,52px);line-height:1.05;font-weight:700;color:#7a2e1c}
.card h2{font-size:clamp(20px,4.6vmin,34px);font-weight:700;color:#7a2e1c}
.card p{font-size:clamp(14px,2.8vmin,19px);line-height:1.45;color:#5a3a22}
.card .btn{font-size:clamp(16px,3.4vmin,24px);padding:calc(var(--p)*3.4)}
.card .sub{font-size:.72em;font-weight:400;opacity:.8}
.fase{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:10px}
.fase:disabled{background:#a98868;box-shadow:none;cursor:default;color:#5a4030}
.stars{display:flex;gap:4px;justify-content:center}
.hide{display:none!important}
</style>
</head>
<style>
.tela{align-items:flex-start}
.card{margin:auto}
#mapa .card{max-width:640px}
.jogar{font-size:clamp(22px,5vmin,34px)!important;padding:calc(var(--p)*5) 0!important}
.idade{font-size:clamp(12px,2.4vmin,16px)!important;opacity:.85}
.mundo{text-align:left;font-weight:700;color:#7a2e1c;font-size:clamp(14px,2.8vmin,19px);margin-top:calc(var(--p)*1.5)}
.fases{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--p)*2.4)}
.fases .mundo{grid-column:1/-1}
.fase{flex-direction:column;align-items:flex-start!important;gap:6px!important;padding:calc(var(--p)*2.4) calc(var(--p)*3)!important;font-size:clamp(13px,2.6vmin,18px)!important;text-align:left}
.fase .stars{justify-content:flex-start}
.fase .num{font-family:'Fredoka',system-ui,sans-serif}
.linha{display:flex;gap:calc(var(--p)*3)}
.linha .btn{flex:1}
</style>

<script>
// ================= MOTOR DE PERGUNTAS =================
const rint=(a,b)=>Math.floor(Math.random()*(b-a))+a;   // = int(random(a,b)) do Construct
const choose=(...v)=>v[Math.floor(Math.random()*v.length)];
// cfg.ops: '+' soma, '-' subtração, 'x' tabuada (cfg.tab), 'X' 2 algarismos × 1 (cfg.mul2=[aMin,aMax,bMax])
function gerarPergunta(cfg){
  const op=choose(...cfg.ops);
  let a,b,res,cands,simb;
  const lim=cfg.lim||10, piso=Math.max(2,Math.floor(lim/5));
  if(op==='+'){ res=rint(piso,lim+1); a=rint(1,res); b=res-a; simb='+'; cands=[res-1,res+1,res-2,res+2,res-10,res+10,Math.abs(a-b)]; }
  else if(op==='-'){ a=rint(piso,lim+1); b=rint(1,a); res=a-b; simb='−'; cands=[res-1,res+1,res-2,res+2,res-10,res+10,a+b]; }
  else {
    if(op==='x'){ a=choose(...cfg.tab); b=rint(1,11); }
    else { a=rint(cfg.mul2[0],cfg.mul2[1]+1); b=rint(2,cfg.mul2[2]+1); }
    res=a*b; simb='×';
    // erros comuns: vizinhos da tabuada, somar em vez de multiplicar, errar por 1 ou 10
    cands=[a*(b+1),a*(b-1),b*(a+1),b*(a-1),a+b,res+1,res-1,res+10,res-10];
    if(op==='x' && Math.random()<.5) [a,b]=[b,a];
  }
  const alts=[res];
  for(let i=0;i<40;i++){ if(alts.length<4){ const c=choose(...cands); if(c>=0&&alts.indexOf(c)===-1) alts.push(c);} }
  for(let i=0;i<4;i++) if(alts.length<4&&alts.indexOf(res+11+i)===-1) alts.push(res+11+i);
  for(let i=alts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [alts[i],alts[j]]=[alts[j],alts[i]]; }
  return {texto:`${a} ${simb} ${b} = ?`,res,alts};
}

// ================= CAMPANHA ÚNICA: 16 fases, do fácil ao difícil =================

const VELS=[{n:'Calma',s:12},{n:'Normal',s:8},{n:'Rápida',s:6}];

  {nome:'Campos',  ceu:['#7cc4e8','#9ad4ee','#b8e3f3'],longe:'#8fc27a',perto:'#6fa85a',grama:'#5c9e4a',gramaD:'#4a8a3c',terra:'#b98a55',terraD:'#9c7243',deco:'arvore',nuvem:1,pool:['slime','goblin'],cor:['#6bd06b','#3f9a4a'],chefe:'Orc dos Campos',nevoa:0},

// ================= ÍCONES EM PIXEL (SVG) =================
function pix(rows,pal,size){
  const h=rows.length,w=rows[0].length; let r='';
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const c=rows[y][x]; if(c!=='.') r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${pal[c]}"/>`; }
  return `<svg viewBox="0 0 ${w} ${h}" width="${size*w}" height="${size*h}">${r}</svg>`;
}

const I_HEART=[".kk.kk.","krrkrrk","kwrrrrk","krrrrRk",".krrRk.","..kRk..","...k..."];
const I_HEART0=[".kk.kk.","keekeek","keeeeek","keeeeEk",".keeEk.","..kEk..","...k..."];
const I_COIN=[".kkkk.","kyyyyk","kylyYk","kylyYk","kyYYYk",".kkkk."];
const I_STAR=["....k....","...kyk...","...kyk...","kkkylykkk","kyyylyyYk",".kyyyyYk.","..kyyyk..",".kyYkYYk.",".kkk.kkk."];
const I_STAR0=["....k....","...kek...","...kek...","kkkeeekkk","keeeeeeEk",".keeeeEk.","..keeek..",".keEkEEk.",".kkk.kkk."];
const I_SKULL=[".kkkk.","ksssSk","kkskkS","ksssSk",".kSSk.",".ksks."];
const I_BLOB=["..kk..",".kggk.","kggggk","kkkkkk"];
const I_DONE=["..kk..",".kyyk.","kyyyyk","kkkkkk"];
const I_HERO=[".kkkk.","khhhhk","kffffk","kfkfkk",".kbbk.",".kkkk."];
const I_SAND=["kkkkk","kyyyk",".kyk.","..k..",".kyk.","kyyyk","kkkkk"];
const I_LOCK=[".kkk.","k...k","kkkkk","kyYyk","kyYyk","kkkkk"];
const icon=(rows,s)=>pix(rows,IP,s);

// ================= SPRITES PROVISÓRIOS (no Construct: Minifantasy) =================
const PAL={k:'#2b1a10',s:'#f2c79b',S:'#d6a477',w:'#ffffff',e:'#2b1a10',b:'#3b6fd1',B:'#2a4f9c',h:'#c9ced8',H:'#8a90a0',r:'#b8323c',R:'#8a222b',g:'#6bd06b',G:'#3f9a4a',o:'#7fae4e',O:'#55783a',y:'#f2c14e',P:'#5a2d91',p:'#7d4bc0',t:'#efe8d8',T:'#bdb39c',m:'#6b4428',v:'#7a4a9a',V:'#4e2e6a'};
const HERO_TOP=["...kkkkk....","..khhhhhk...","..kHhhhHkk..","..kssssssk..","..kswsswsk..","...kSsssk...","..kBbbbbBk..",".ksBbybbBsk.",".ksbbbbbbsk.","..kBmmmmBk.."];
const HERO_LEGS=[["..kbbkkbbk..","..kBBkkBBk..","..kkkk.kkkk."],["..kbbk.kbbk.",".kBBk...kBBk",".kkk.....kkk"],["...kbbbbk...","...kBBBBk...","..kkkkkkkk.."]];
const SPR={
  slime:["............","............","............","....kkkk....","...kggggk...","..kggwggwk..","..kggekgek..",".kgggggggGk.",".kgGgggggGk.","kgGGGGGGGGGk","kkkkkkkkkkkk"],
  goblin:["..k.kkkk.k..",".kokooookok.","..koooooook.","...kowoowk..","...koekoek..","....koyyok..","..kRrrrrrRk.",".korrrrrrrok","..kRrrrrrRk.","...kOk.kOk..","...kOk.kOk..","..kkkk.kkkk."],

function iniciarFase(i){

function atualizarTrilha(frac){

  });

function proximoInimigo(primeiro){
  const base=ONDA[onda]; inimigo={...base,hp:base.vida};

function responder(btn){

    podeResponder=false; btn.classList.add('certo'); acertos++;

function estrelasDaFase(){ const t=acertos+erros,p=t?acertos/t:0; return p>=.9&&vida>=3?3:p>=.7?2:1; }

function spr(s,x,y,sc,flip,flash,alpha,pal){
  ctx.globalAlpha=alpha;
  for(let r=0;r<s.length;r++) for(let c=0;c<s[r].length;c++){
    const ch=s[r][flip?s[r].length-1-c:c]; if(ch==='.') continue;
    ctx.fillStyle=flash?(ch==='k'?'#2b1a10':'#fff'):(pal&&pal[ch])||PAL[ch];
    ctx.fillRect(Math.round(x+c*sc),Math.round(y+r*sc),Math.ceil(sc),Math.ceil(sc));
  }
  ctx.globalAlpha=1;
}
function texto(t,x,y,cor,esc=1){
  const w=t.length*4*esc; x=Math.round(x-w/2); y=Math.round(y);
  for(const pass of [0,1]) for(let i=0;i<t.length;i++){ const g=DIG[t[i]]; if(!g) continue;
    for(let r=0;r<5;r++) for(let c=0;c<3;c++) if(g[r][c]==='1'){
      if(pass===0){ ctx.fillStyle='#2b1a10'; ctx.fillRect(x+i*4*esc+c*esc-1,y+r*esc-1,esc+2,esc+2); }
      else { ctx.fillStyle=cor; ctx.fillRect(x+i*4*esc+c*esc,y+r*esc,esc,esc); }
    }}
}
const hash=k=>{ const x=Math.sin(k*127.1+311.7)*43758.5453; return x-Math.floor(x); };
function morros(off,base,amp,per,cor){
  ctx.fillStyle=cor;
  for(let x=0;x<W;x+=2){ const wx=x+off; const y=Math.round(base-(Math.sin(wx/per)*amp+Math.sin(wx/(per*.37))*amp*.35+amp)); ctx.fillRect(x,y,2,H-y); }
}
function deco(tipo,x){
  x=Math.round(x); const y=CHAO-8;
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(x-1,y,14,2);
  if(tipo==='arvore'||tipo==='escura'){ const e=tipo==='escura';
    ctx.fillStyle=e?'#4a3020':'#6b4428'; ctx.fillRect(x+5,y-9,3,9);
    ctx.fillStyle=e?'#1f4a2a':'#2f6b3a'; ctx.fillRect(x,y-21,13,12); ctx.fillRect(x+2,y-24,9,3); if(e) ctx.fillRect(x+3,y-28,7,4);
    ctx.fillStyle=e?'#2e6238':'#3f8a4a'; ctx.fillRect(x+2,y-20,6,4);
    if(e){ ctx.fillStyle='#d9473a'; ctx.fillRect(x+11,y-3,3,2); ctx.fillStyle='#efe8d8'; ctx.fillRect(x+12,y-1,1,1); } }
  else if(tipo==='junco'){ ctx.fillStyle='#3e5a2a'; for(let i=0;i<4;i++) ctx.fillRect(x+i*3,y-8-((i*5)%7),1,8+((i*5)%7)); ctx.fillStyle='#6b4428'; ctx.fillRect(x+3,y-13,2,4); ctx.fillRect(x+9,y-11,2,4);
    ctx.fillStyle='rgba(120,160,140,.35)'; ctx.fillRect(x-4,y+2,20,2); }
  else if(tipo==='cacto'){ ctx.fillStyle='#3f7a3a'; ctx.fillRect(x+5,y-17,4,17); ctx.fillRect(x+1,y-12,4,2); ctx.fillRect(x+1,y-15,2,4); ctx.fillRect(x+9,y-9,3,2); ctx.fillRect(x+10,y-13,2,5); ctx.fillStyle='#5a9a4a'; ctx.fillRect(x+6,y-16,1,14); }
  else if(tipo==='pinheiro'){ ctx.fillStyle='#5a3a24'; ctx.fillRect(x+5,y-5,3,5); ctx.fillStyle='#2e5b4a'; for(let i=0;i<4;i++) ctx.fillRect(x+6-i*2,y-22+i*4,1+i*4,5); ctx.fillStyle='#fff'; ctx.fillRect(x+5,y-22,3,2); ctx.fillRect(x+2,y-14,4,1); }
  else if(tipo==='cristal'){ ctx.fillStyle='#7d4bc0'; ctx.fillRect(x+3,y-14,4,14); ctx.fillStyle='#c79bff'; ctx.fillRect(x+4,y-13,1,9); ctx.fillStyle='#5a2d91'; ctx.fillRect(x,y-7,3,7); ctx.fillRect(x+8,y-5,3,5);
    ctx.fillStyle='rgba(199,155,255,.10)'; ctx.fillRect(x-8,y-24,26,26); }
  else if(tipo==='lava'){ ctx.fillStyle='#2a1a18'; ctx.fillRect(x,y-8,12,8); ctx.fillRect(x+2,y-11,8,3); ctx.fillStyle=Math.floor(fx.t*3+x)%2?'#ff7a2a':'#ffb347'; ctx.fillRect(x+3,y-6,1,4); ctx.fillRect(x+4,y-3,4,1); ctx.fillRect(x+8,y-8,1,3); }
  else { // pilar do castelo com estandarte
    ctx.fillStyle='#6a6a7a'; ctx.fillRect(x+2,y-34,9,34); ctx.fillStyle='#8a8a9a'; ctx.fillRect(x+3,y-34,2,34); ctx.fillStyle='#4a4a5a'; ctx.fillRect(x,y-36,13,3);
    ctx.fillStyle='#b8323c'; ctx.fillRect(x+3,y-31,7,12); ctx.fillRect(x+3,y-19,2,2); ctx.fillRect(x+8,y-19,2,2); ctx.fillStyle='#f2c14e'; ctx.fillRect(x+6,y-27,1,4); ctx.fillRect(x+5,y-26,3,1); }
}
function drawScene(dt){
  fx.t+=dt; const F=M();
  ctx.save();
  if(shake>0){ ctx.translate(Math.round((Math.random()-.5)*4),Math.round((Math.random()-.5)*3)); shake-=dt; }
  const bh=Math.ceil(70/3); F.ceu.forEach((c,i)=>{ ctx.fillStyle=c; ctx.fillRect(-4,i*bh-4,W+8,bh+4); });
  ctx.fillStyle=F.ceu[2]; ctx.fillRect(-4,70,W+8,H);
  if(F.nuvem){ ctx.fillStyle=F.nevoa?'rgba(255,255,255,.55)':'#fff';
    for(let k=0;k<4;k++){ const x=((k*97+fx.t*4-scroll*0.08)%(W+60)+W+60)%(W+60)-40, y=10+hash(k)*30;
      ctx.fillRect(Math.round(x),Math.round(y),24,5); ctx.fillRect(Math.round(x)+5,Math.round(y)-3,12,3); } }

    ctx.fillStyle=F.longe; ctx.fillRect(-4,20,W+8,H);
    ctx.fillStyle=F.perto; const o=Math.round(scroll*0.4);
    for(let r=0;r<10;r++) for(let c=-1;c<W/16+2;c++){ ctx.fillRect(c*16-(o%16)+(r%2?8:0),22+r*9,15,1); ctx.fillRect(c*16-(o%16)+(r%2?8:0),22+r*9,1,9); }
    for(let c=-1;c<W/40+2;c++){ const x=c*40-(o%40)+14; ctx.fillStyle='#1a1c30'; ctx.fillRect(x,40,8,14); ctx.fillStyle='#f2c14e'; ctx.fillRect(x+2,44,4,8); }
  } else {
    if(F.teto){ ctx.fillStyle=F.longe; for(let x=0;x<W;x+=6){ const k=Math.floor((x+scroll*.4)/6); ctx.fillRect(x-Math.round((scroll*.4)%6),0,6,6+Math.floor(hash(k)*14)); } }
    morros(scroll*0.15,74,7,26,F.longe);
    morros(scroll*0.4+500,86,5,17,F.perto);
    if(F.vulcao){ ctx.fillStyle='#ff6a2a'; for(let k=0;k<3;k++){ const x=((k*120-scroll*0.15)%(W+120)+W+120)%(W+120)-60; ctx.fillRect(Math.round(x)+18,58+k*3,3,20); } }
  }
  ctx.fillStyle=F.grama; ctx.fillRect(-4,CHAO-10,W+8,H);
  const step=44;
  for(let k=Math.floor(scroll/step)-1;k<=Math.floor((scroll+W)/step)+1;k++) if(hash(k)>.5) deco(F.deco,k*step-scroll+hash(k+9)*18);
  ctx.fillStyle=F.gramaD;
  for(let k=Math.floor(scroll/7);k<=Math.floor((scroll+W)/7)+1;k++){ const x=Math.round(k*7-scroll+hash(k)*3); if(hash(k+2)>.4) ctx.fillRect(x,CHAO-7+Math.floor(hash(k+4)*3),1,2); }
  ctx.fillStyle=F.terra; ctx.fillRect(-4,CHAO-2,W+8,12);
  ctx.fillStyle=F.terraD; ctx.fillRect(-4,CHAO-2,W+8,1); ctx.fillRect(-4,CHAO+9,W+8,1);
  for(let k=Math.floor(scroll/9);k<=Math.floor((scroll+W)/9)+1;k++){ if(hash(k+7)>.55) ctx.fillRect(Math.round(k*9-scroll),CHAO+2+Math.floor(hash(k)*5),2,1); }
  ctx.fillStyle=F.grama; ctx.fillRect(-4,CHAO+10,W+8,H);
  ctx.fillStyle=F.gramaD; for(let k=Math.floor(scroll/5);k<=Math.floor((scroll+W)/5)+1;k++){ if(hash(k+11)>.5) ctx.fillRect(Math.round(k*5-scroll),CHAO+12+Math.floor(hash(k+1)*14),1,1); }
  if(F.brasa){ for(let k=0;k<10;k++){ const life=(fx.t*0.4+hash(k))%1; ctx.fillStyle=life<.5?'#ffb347':'#ff6a2a'; ctx.fillRect(Math.round(hash(k+3)*W),Math.round(H-life*H),1,1); } }

  const andando=estado==='andando';
  const bob=andando?(Math.floor(fx.t*8)%2):(Math.floor(fx.t*2)%2);
  const legs=andando?HERO_LEGS[1+Math.floor(fx.t*8)%2]:HERO_LEGS[0];
  const hx=heroX()+Math.sin(Math.min(fx.heroX,1)*Math.PI)*30, hy=CHAO-39+bob;
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(Math.round(hx)+6,CHAO+1,24,3);
  spr(HERO_TOP.concat(legs),hx,hy,3,false,fx.heroFlash>0&&Math.floor(fx.t*20)%2===0,1);
  const atk=fx.heroX>0;
  ctx.fillStyle='#2b1a10'; ctx.fillRect(Math.round(hx+32),hy+(atk?2:9),5,16);
  ctx.fillStyle='#e8e8f0'; ctx.fillRect(Math.round(hx+33),hy+(atk?3:10),3,12);
  ctx.fillStyle='#f2c14e'; ctx.fillRect(Math.round(hx+30),hy+(atk?14:21),9,2);

  if(inimigo&&fx.enAlpha>0){
    const S=SPR[inimigo.tipo], s=3*inimigo.escala, w=12*s, h=S.length*s;
    let ex=enemyStandX(inimigo); if(andando) ex+=(walkDur-walkT)*VEL;
    ex-=Math.sin(Math.min(fx.enX,1)*Math.PI)*30;
    const voa=inimigo.tipo==='morcego';
    const anim=voa?Math.round(Math.sin(fx.t*6)*3):inimigo.tipo==='slime'?Math.floor(fx.t*3)%2:Math.floor(fx.t*2+1)%2;
    const ey=CHAO-h+1+(voa?-22:0)+anim;
    ctx.globalAlpha=fx.enAlpha; ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(Math.round(ex)+(voa?10:4),CHAO+1,voa?w-20:w-8,3); ctx.globalAlpha=1;
    let pal=null;
    if(inimigo.tipo==='slime') pal={g:F.cor[0],G:F.cor[1]};
    if(inimigo.tipo==='orc') pal={P:F.cor[1],p:F.cor[0]};
    spr(S,ex,ey,s,true,fx.enFlash>0&&Math.floor(fx.t*20)%2===0,Math.max(0,fx.enAlpha),pal);
    if(!andando&&estado!=='pausa'){
      const n=inimigo.vida,sw=5,tot=n*(sw+1)+1,bx=Math.round(ex+w/2-tot/2),by=Math.round(ey-8);
      ctx.fillStyle='#2b1a10'; ctx.fillRect(bx,by,tot,5);
      for(let i=0;i<n;i++){ ctx.fillStyle=i<inimigo.hp?'#d9473a':'#5a3b2e'; ctx.fillRect(bx+1+i*(sw+1),by+1,sw,3); }
      if(inimigo.boss){ ctx.fillStyle='#f2c14e'; ctx.fillRect(Math.round(ex+w/2-7),by-6,14,3); ctx.fillRect(Math.round(ex+w/2-7),by-9,2,3); ctx.fillRect(Math.round(ex+w/2-1),by-10,2,4); ctx.fillRect(Math.round(ex+w/2+5),by-9,2,3); }
    }
  }
  fx.sparks=fx.sparks.filter(p=>{ p.t+=dt; p.vy+=200*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; ctx.fillStyle=p.t<.12?'#fff':'#f2c14e'; ctx.fillRect(Math.round(p.x),Math.round(p.y),2,2); return p.t<.35; });
  fx.coins=fx.coins.filter(c=>{ c.t+=dt;
    if(c.t<.55){ c.vy+=220*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; if(c.y>CHAO-4){c.y=CHAO-4;c.vy*=-.45;} }
    else { const tx=W-14,ty=6; c.x+=(tx-c.x)*Math.min(1,dt*7); c.y+=(ty-c.y)*Math.min(1,dt*7); }
    const x=Math.round(c.x),y=Math.round(c.y); ctx.fillStyle='#2b1a10'; ctx.fillRect(x-1,y-1,6,6); ctx.fillStyle='#f2c14e'; ctx.fillRect(x,y,4,4); ctx.fillStyle='#fff1b8'; ctx.fillRect(x+1,y,1,2);
    return c.t<1.2; });
  fx.coracoes=fx.coracoes.filter(c=>{ c.t+=dt;
    if(c.t<.5){ c.vy+=200*dt; c.y+=c.vy*dt; if(c.y>CHAO-8){c.y=CHAO-8;c.vy*=-.4;} }
    else { const tx=8,ty=6; c.x+=(tx-c.x)*Math.min(1,dt*6); c.y+=(ty-c.y)*Math.min(1,dt*6); }
    const x=Math.round(c.x),y=Math.round(c.y); ctx.fillStyle='#2b1a10'; ctx.fillRect(x-1,y-1,9,7); ctx.fillStyle='#d9473a'; ctx.fillRect(x,y,3,3); ctx.fillRect(x+4,y,3,3); ctx.fillRect(x+1,y+3,5,2); ctx.fillRect(x+3,y+5,1,1);
    if(c.t>=1.1&&!c.ok){ c.ok=1; vida=Math.min(vidaMax,vida+1); hud(); }
    return c.t<1.1; });
  fx.nums=fx.nums.filter(n=>{ n.t+=dt; texto(n.txt,n.x,n.y-n.t*22,n.c,2); return n.t<.7; });
  ctx.restore();
  fx.heroX=fx.heroX>0?(fx.heroX+dt*4>=1?0:fx.heroX+dt*4):0;
  fx.enX=fx.enX>0?(fx.enX+dt*4>=1?0:fx.enX+dt*4):0;
  fx.heroFlash=Math.max(0,fx.heroFlash-dt*2.5); fx.enFlash=Math.max(0,fx.enFlash-dt*2.5);
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(estado==='titulo') scroll+=12*dt;
  if(estado==='andando'){ walkT+=dt; scroll+=VEL*dt; atualizarTrilha(Math.min(1,walkT/walkDur)); if(walkT>=walkDur){walkT=walkDur;chegou();} }
  if(estado==='batalha'&&podeResponder){ tAtaque-=dt; if(tAtaque<=0){ feedback('Muito lento!','#ff8a7a'); inimigoAtaca(); } }
  const f=estado==='batalha'?Math.max(0,tAtaque)/tAtaqueMax:1, tf=$('tfill');
  tf.style.width=(f*100)+'%'; tf.style.background=f<.33?'#d9473a':f<.66?'#f2c14e':'#7fc464';
  drawScene(dt); requestAnimationFrame(loop);
}

$('btnB').onclick=abrirMapa;
$('coinIco').innerHTML=icon(I_COIN,3); $('ampIco').innerHTML=icon(I_SAND,3);
ONDA=[{nome:'',tipo:'slime',vida:2,escala:1}];
ajustarCanvas(); montarTrilha(); hud(); requestAnimationFrame(loop);
