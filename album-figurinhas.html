<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Álbum de Figurinhas — Overcast Realm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#181229; --bg-panel:#241c3d; --bg-card:#2c2350; --border:#4a3a7c;
    --pink:#ff5fa2; --cyan:#4be8ff; --yellow:#ffd23f; --green:#4be08f; --purple:#a06bff; --orange:#ff9a3c;
    --ink:#ffffff; --ink-soft:#c9bfe8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 10%, #2e2258 0%, transparent 45%),
      radial-gradient(circle at 90% 20%, #1e3a52 0%, transparent 40%),
      radial-gradient(circle at 50% 100%, #3a2a55 0%, transparent 50%),
      var(--bg-deep);
    color:var(--ink); font-family:'Baloo 2', sans-serif; min-height:100vh; padding:14px;
  }
  .wrap{max-width:1100px;margin:0 auto;}
  h1,h2,.pixel{ font-family:'Press Start 2P', monospace; }

  .back-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .back-home{
    display:inline-flex; align-items:center; gap:5px; font-weight:700; font-size:12px;
    color:var(--ink-soft); background:var(--bg-card); border:2px solid var(--border);
    border-radius:999px; padding:8px 14px; text-decoration:none;
  }
  header{ text-align:center; margin-bottom:16px; }
  header h1{ font-size:clamp(16px,3vw,24px); color:var(--yellow); text-shadow:3px 3px 0 #000; margin:0 0 8px; }
  header p{ font-weight:700; color:var(--ink-soft); font-size:14px; margin:0; }

  .panel{
    background:var(--bg-panel); border:3px solid var(--border); border-radius:22px;
    box-shadow:0 8px 0 #120c22; padding:22px; margin-bottom:16px;
  }

  /* --- vincular --- */
  #sem-vinculo{ text-align:center; padding:40px 20px; }
  .btn{
    font-family:'Press Start 2P', monospace; font-size:11px; color:#fff; border:none;
    border-radius:999px; padding:12px 20px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.3);
  }
  .btn.purple{ background:var(--purple); } .btn.gray{ background:#4a3a7c; }
  .zoom-overlay{ position:fixed; inset:0; background:rgba(10,6,20,.75); display:none; align-items:center; justify-content:center; z-index:999; padding:16px; }
  .zoom-overlay.show{ display:flex; }
  .zoom-box{ background:var(--bg-panel); border:3px solid var(--border); border-radius:20px; padding:22px; max-width:400px; width:100%; }
  .zoom-box input{ width:100%; padding:10px; border-radius:8px; border:2px solid var(--border); background:#150f24; color:#fff; font-family:'Baloo 2',sans-serif; margin-bottom:8px; box-sizing:border-box; }
  #link-aluno-list{ display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto; margin-bottom:8px; }

  /* --- seletor de dono do álbum --- */
  .album-tabs{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:18px; }
  .album-tab-btn{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:12px; color:var(--ink-soft);
    background:var(--bg-card); border:2px solid var(--border); border-radius:999px; padding:8px 14px; cursor:pointer;
  }
  .album-tab-btn.active{ background:var(--yellow); border-color:var(--yellow); color:#241c3d; }

  /* --- capa do álbum --- */
  .album-header{ text-align:center; margin-bottom:18px; }
  .album-header h2{ font-size:14px; color:var(--yellow); margin:0 0 4px; }
  .album-header p{ color:var(--ink-soft); font-weight:700; font-size:13px; margin:0; }
  .progress-bar-outer{ width:100%; max-width:360px; margin:10px auto 0; background:#150f24; border:2px solid var(--border); border-radius:999px; height:14px; overflow:hidden; }
  .progress-bar-inner{ height:100%; background:linear-gradient(90deg,var(--green),var(--cyan)); transition:width .3s; }

  /* --- grade de figurinhas estilo álbum --- */
  .sticker-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
    gap:14px;
  }
  .sticker-slot{
    aspect-ratio:1;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .sticker-slot.filled{
    background:linear-gradient(160deg,#3a2f5c,#241c3d);
    border:3px solid var(--yellow);
    box-shadow:0 4px 0 rgba(0,0,0,.35), inset 0 0 0 3px rgba(255,255,255,.06);
    cursor:pointer;
  }
  .sticker-slot.empty{
    background:repeating-linear-gradient(45deg, #1c1630, #1c1630 8px, #221a38 8px, #221a38 16px);
    border:3px dashed #443a63;
  }
  .sticker-slot.empty span{ font-size:26px; opacity:.35; }
  .sticker-slot img{
    width:75%; height:75%; object-fit:contain; image-rendering:pixelated;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));
  }
  .sticker-slot .sticker-shine{
    position:absolute; top:-40%; left:-40%; width:60%; height:180%;
    background:rgba(255,255,255,.12); transform:rotate(25deg);
    pointer-events:none;
  }
  .sticker-title{
    position:absolute; bottom:2px; left:0; right:0; text-align:center;
    font-size:9px; font-weight:800; color:#fff; text-shadow:0 1px 2px #000;
    background:rgba(0,0,0,.35); padding:2px 4px;
  }

  .empty-album-msg{ text-align:center; color:var(--ink-soft); font-weight:700; padding:40px 20px; grid-column:1/-1; }

  .lightbox{
    position:fixed; inset:0; background:rgba(10,6,20,.9); z-index:999;
    display:none; align-items:center; justify-content:center; padding:20px; flex-direction:column; gap:14px;
  }
  .lightbox.show{ display:flex; }
  .lightbox img{ width:260px; height:260px; object-fit:contain; image-rendering:pixelated; border-radius:16px; border:5px solid var(--yellow); background:#1c1630; }
  .lightbox h3{ color:var(--yellow); font-size:15px; margin:0; }
  .lightbox-close{
    position:absolute; top:16px; right:16px; font-family:'Press Start 2P',monospace; font-size:11px;
    color:#fff; background:var(--bg-card); border:2px solid var(--border); border-radius:999px;
    padding:10px 16px; cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="back-row">
    <a href="./index.html" class="back-home">← Voltar</a>
  </div>

  <header>
    <h1>🏷️ ÁLBUM DE FIGURINHAS</h1>
    <p>Overcast Realm — Arte Digital</p>
  </header>

  <div id="sem-vinculo" class="panel">
    <div style="font-size:44px;">📖</div>
    <p style="font-weight:800; margin:10px 0;">Vincule seu nome pra ver o seu álbum e o dos seus colegas</p>
    <button class="btn purple" onclick="abrirModalVincular()">🔗 Vincular meu nome</button>
  </div>

  <div id="album-conteudo" style="display:none;">
    <div class="album-tabs" id="album-tabs"></div>

    <div class="panel">
      <div class="album-header">
        <h2 id="album-dono-nome">—</h2>
        <p id="album-contagem">0 figurinhas</p>
        <div class="progress-bar-outer"><div class="progress-bar-inner" id="album-progress" style="width:0%;"></div></div>
      </div>
      <div class="sticker-grid" id="sticker-grid"></div>
    </div>
  </div>

</div>

<!-- ============== MODAL: vincular nome ============== -->
<div class="zoom-overlay" id="link-modal">
  <div class="zoom-box">
    <h3 style="color:var(--yellow); font-size:13px; margin:0 0 14px;">🔗 Vincular meu nome</h3>
    <div id="link-step-turma">
      <input type="text" id="link-turma-code" placeholder="Código da turma">
      <button class="btn purple" style="width:100%; justify-content:center;" onclick="buscarTurma()">🔎 Buscar Turma</button>
      <div id="link-turma-error" style="font-weight:800;color:var(--pink);font-size:12px;margin-top:8px;"></div>
    </div>
    <div id="link-step-aluno" style="display:none;">
      <p style="font-weight:800;color:var(--yellow);font-size:14px;">Turma: <span id="link-turma-name"></span></p>
      <p style="font-weight:700;color:var(--ink-soft);font-size:12px;">Clique no seu nome:</p>
      <div id="link-aluno-list"></div>
      <button class="btn gray" style="width:100%; justify-content:center;" onclick="voltarStepTurma()">← Trocar turma</button>
    </div>
    <button class="btn gray" style="width:100%; justify-content:center; margin-top:8px;" onclick="fecharModalVincular()">✕ Fechar</button>
  </div>
</div>

<!-- ============== LIGHTBOX ============== -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="fecharLightbox()">✕ Fechar</button>
  <h3 id="lightbox-title"></h3>
  <img id="lightbox-img" src="" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://kezlmecrxhjahhoekybs.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlemxtZWNyeGhqYWhob2VreWJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MDkwNjAsImV4cCI6MjEwMjQ4NTA2MH0.-TcsKrFxRMeiqKrzXk57E8-60eobk3fJ0Crn7ci0MW8";
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const IDENTITY_KEY = 'overcast_course_identity'; // mesma chave do course-gate/loja, reaproveita o vínculo

let meuAluno = null;   // {codigo, nome}
let turmaAlunos = [];  // todos os alunos da turma vinculada
let donoAtualId = null;

function urlPublica(path){ return sb.storage.from('submissoes').getPublicUrl(path).data.publicUrl; }

function getIdentitySalva(){
  try{
    const raw = sessionStorage.getItem(IDENTITY_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

async function init(){
  const identity = getIdentitySalva();
  if(identity && identity.codigo){
    meuAluno = { codigo: identity.codigo, nome: identity.nome };
    await carregarAlbum(identity.turmaCodigo);
  } else {
    document.getElementById('sem-vinculo').style.display = 'block';
  }
}

async function carregarAlbum(turmaCodigo){
  if(!sb) return;
  document.getElementById('sem-vinculo').style.display = 'none';
  document.getElementById('album-conteudo').style.display = 'block';

  const { data: turma } = await sb.from('turmas').select('*').eq('codigo_acesso', turmaCodigo).maybeSingle();
  if(!turma) return;
  const { data: alunos } = await sb.from('alunos').select('*').eq('turma_id', turma.id).order('nome');
  turmaAlunos = alunos || [];

  const euMesmo = turmaAlunos.find(a => a.codigo === meuAluno.codigo);
  donoAtualId = euMesmo ? euMesmo.id : (turmaAlunos[0] && turmaAlunos[0].id);

  montarTabs();
  await mostrarAlbumDe(donoAtualId);
}

function montarTabs(){
  const tabs = document.getElementById('album-tabs');
  tabs.innerHTML = turmaAlunos.map(a => `
    <button class="album-tab-btn ${a.id===donoAtualId?'active':''}" onclick="mostrarAlbumDe('${a.id}')">
      ${a.codigo === meuAluno.codigo ? '⭐ ' : ''}${a.nome}
    </button>
  `).join('');
}

async function mostrarAlbumDe(alunoId){
  donoAtualId = alunoId;
  montarTabs();

  const aluno = turmaAlunos.find(a => a.id === alunoId);
  const { data: figurinhas } = await sb.from('figurinhas').select('*').eq('aluno_id', alunoId).order('criado_em');

  document.getElementById('album-dono-nome').textContent = aluno ? `📖 Álbum de ${aluno.nome}` : '📖 Álbum';
  const qtd = (figurinhas || []).length;
  document.getElementById('album-contagem').textContent = qtd === 0 ? 'Nenhuma figurinha ainda' : `${qtd} figurinha${qtd>1?'s':''} coletada${qtd>1?'s':''}`;

  const meta = 12; // barra de progresso visual, meta "de referência" pra encher a página
  const pct = Math.min(100, Math.round((qtd/meta)*100));
  document.getElementById('album-progress').style.width = pct + '%';

  const grid = document.getElementById('sticker-grid');
  if(!qtd){
    grid.innerHTML = `<p class="empty-album-msg">📭 Ainda não tem nenhuma figurinha aqui.<br>Continue fazendo arte digital!</p>`;
    return;
  }

  const totalSlots = Math.max(meta, qtd);
  let html = '';
  for(let i=0; i<totalSlots; i++){
    const fig = figurinhas[i];
    if(fig){
      html += `
        <div class="sticker-slot filled" onclick="abrirLightbox('${fig.titulo.replace(/'/g,"\\'")}', '${urlPublica(fig.storage_path)}')">
          <div class="sticker-shine"></div>
          <img src="${urlPublica(fig.storage_path)}" alt="${fig.titulo}">
          <div class="sticker-title">${fig.titulo}</div>
        </div>`;
    } else {
      html += `<div class="sticker-slot empty"><span>?</span></div>`;
    }
  }
  grid.innerHTML = html;
}

function abrirLightbox(titulo, url){
  document.getElementById('lightbox-title').textContent = titulo;
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('show');
}
function fecharLightbox(){ document.getElementById('lightbox').classList.remove('show'); }
document.getElementById('lightbox').addEventListener('click', e => { if(e.target.id==='lightbox') fecharLightbox(); });

/* ---- vincular (mesmo padrão de sempre) ---- */
let turmaBusca = null;
function abrirModalVincular(){ document.getElementById('link-modal').classList.add('show'); }
function fecharModalVincular(){ document.getElementById('link-modal').classList.remove('show'); }
async function buscarTurma(){
  const code = document.getElementById('link-turma-code').value.trim().toLowerCase();
  const errEl = document.getElementById('link-turma-error');
  if(!code){ errEl.textContent = '👉 Digite o código da turma.'; return; }
  if(!sb){ errEl.textContent = '❌ Não consegui conectar.'; return; }
  errEl.textContent = '⏳ Buscando...';
  const { data: turma, error } = await sb.from('turmas').select('*').eq('codigo_acesso', code).maybeSingle();
  if(error || !turma){ errEl.textContent = '❌ Turma não encontrada.'; return; }
  errEl.textContent = '';
  const { data: alunos } = await sb.from('alunos').select('*').eq('turma_id', turma.id).order('nome');
  turmaBusca = { turma, alunos: alunos || [] };
  document.getElementById('link-turma-name').textContent = turma.nome;
  document.getElementById('link-aluno-list').innerHTML = (alunos && alunos.length)
    ? alunos.map((a,i) => `<button class="btn purple" style="width:100%;justify-content:center;" data-i="${i}">${a.nome}</button>`).join('')
    : '<p style="font-size:12px;">Nenhum aluno cadastrado.</p>';
  document.querySelectorAll('#link-aluno-list .btn').forEach(btn => {
    btn.onclick = () => escolherAluno(parseInt(btn.dataset.i, 10));
  });
  document.getElementById('link-step-turma').style.display = 'none';
  document.getElementById('link-step-aluno').style.display = 'block';
}
function voltarStepTurma(){
  document.getElementById('link-step-turma').style.display = 'block';
  document.getElementById('link-step-aluno').style.display = 'none';
}
async function escolherAluno(i){
  if(!turmaBusca) return;
  const aluno = turmaBusca.alunos[i];
  if(!aluno) return;
  sessionStorage.setItem(IDENTITY_KEY, JSON.stringify({
    codigo: aluno.codigo, nome: aluno.nome, turmaCodigo: turmaBusca.turma.codigo_acesso,
    tipoCurso: turmaBusca.turma.tipo_curso, linkedAt: Date.now()
  }));
  meuAluno = { codigo: aluno.codigo, nome: aluno.nome };
  fecharModalVincular();
  await carregarAlbum(turmaBusca.turma.codigo_acesso);
}

init();
</script>
</body>
</html>
