<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labirinto do Robô — Overcast Realm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8ec;
    --sky:#5ec9ff;
    --sky-dark:#2fa8ec;
    --sun:#ffc93c;
    --coral:#ff7a6b;
    --mint:#3ddc97;
    --grape:#a06bff;
    --gold:#e8a800;
    --ink:#3a2b52;
    --ink-soft:#6b5b8a;
    --card:#ffffff;
    --card-edge:#f0e4d0;
    --ok:#2bb673;
    --ok-bg:#e3fbf0;
    --bad:#ff5c5c;
    --bad-bg:#ffecec;
    --cell-size:44px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:
      radial-gradient(circle at 8% 6%, #ffe9b8 0%, transparent 40%),
      radial-gradient(circle at 95% 15%, #bfeaff 0%, transparent 38%),
      radial-gradient(circle at 90% 95%, #d8f5e6 0%, transparent 40%),
      var(--bg);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    height:100dvh;
    padding:8px 10px;
    display:flex;
  }
  .wrap{max-width:980px;margin:0 auto;width:100%;height:100%;display:flex;flex-direction:column;min-height:0;}

  .back-home {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 12px;
    color: var(--ink-soft);
    background: var(--card);
    border: 2px solid var(--card-edge);
    border-radius: 999px;
    padding: 5px 12px;
    text-decoration: none;
    box-shadow: 0 3px 0 var(--card-edge);
    flex-shrink:0;
  }
  .back-home:hover { color: var(--sky-dark); }
  .back-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 6px; flex-shrink:0; }

  header{ text-align:center; margin-bottom:4px; flex-shrink:0; }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(16px,3vh,24px);
    line-height:1.1;
    margin:0;
    color:var(--sky-dark);
  }
  .subtitle{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:clamp(11px,1.6vh,14px);
    color:var(--ink-soft);
    margin:3px 0 0;
  }

  .legend{
    display:flex;
    justify-content:center;
    gap:14px;
    margin:4px 0;
    flex-wrap:wrap;
    flex-shrink:0;
  }
  .legend .li{
    display:flex; align-items:center; gap:4px;
    font-size:clamp(14px,2.2vh,20px);
  }
  .legend .li small{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:10px;
    color:var(--ink-soft);
  }

  .levels-strip{
    display:flex;
    flex-wrap:nowrap;
    gap:5px;
    justify-content:flex-start;
    margin:6px auto;
    max-width:100%;
    overflow-x:auto;
    padding:2px 4px 6px;
    flex-shrink:0;
    scroll-behavior:smooth;
  }
  .fase-atual-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:15px;
    color:var(--sky-dark, #2b7fd1);
    background:#e3f4ff;
    border:2px solid var(--sky-dark, #2b7fd1);
    border-radius:999px;
    display:inline-block;
    padding:5px 16px;
    margin:6px 0 0;
  }
  .level-dot{
    width:26px; height:26px;
    flex-shrink:0;
    border-radius:50%;
    border:2px solid var(--card-edge);
    background:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:11px;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .level-dot.active{ border-color:var(--sky-dark); color:var(--sky-dark); background:#e3f4ff; transform:scale(1.12); }
  .level-dot.done{ background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .level-dot.locked{ background:#f2f0f7; border-color:#e3ddef; color:#c9c1db; cursor:default; font-size:12px; }

  .game-card{
    background:var(--card);
    border:3px solid var(--card-edge);
    border-radius:20px;
    box-shadow:0 6px 0 var(--card-edge);
    padding:12px;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:row;
    gap:14px;
    overflow:hidden;
  }

  .stage-left{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
    align-items:center;
    justify-content:center;
    min-width:0;
    min-height:0;
    overflow:auto;
  }

  #maze{
    display:grid;
    gap:3px;
    background:#e7f5ff;
    border:3px solid #cfeaff;
    border-radius:14px;
    padding:6px;
    flex-shrink:0;
  }
  .cell{
    width:var(--cell-size, 44px);
    height:var(--cell-size, 44px);
    border-radius:8px;
    background:#fbfdff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:calc(var(--cell-size, 44px) * 0.46);
    position:relative;
  }
  .cell.tree{ background:#e6f9ee; }
  .cell.rock{ background:#f4efe4; }
  .cell.goal{ background:#fff6da; }
  .cell.char{ background:#dff1ff; }
  .cell .robot{ font-size:1.1em; transition:transform .15s; }
  .cell .coin-mark{ position:absolute; font-size:0.5em; bottom:1px; right:1px; }
  .cell.bump .robot{ animation:bump .3s; }
  @keyframes bump{
    0%{transform:scale(1);}
    40%{transform:scale(0.8) rotate(-10deg);}
    100%{transform:scale(1);}
  }
  .cell.hop .robot{ animation:hop .35s; }
  @keyframes hop{
    0%{transform:translateY(0);}
    40%{transform:translateY(-14px) scale(1.1);}
    100%{transform:translateY(0);}
  }
  .cell.win .robot{ animation:win .6s; }
  @keyframes win{
    0%{transform:scale(1) rotate(0);}
    50%{transform:scale(1.5) rotate(20deg);}
    100%{transform:scale(1) rotate(0);}
  }
  .cell.sparkle .coin-mark{ animation:sparkle .4s; }
  @keyframes sparkle{
    0%{transform:scale(1); opacity:1;}
    100%{transform:scale(2); opacity:0;}
  }

  .coin-status{
    display:flex; align-items:center; justify-content:center; gap:4px;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:13px;
    color:var(--gold);
    margin-top:4px;
    flex-shrink:0;
  }

  .controls{
    width:200px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    overflow-y:auto;
    min-height:0;
    border-left:3px dashed var(--card-edge);
    padding-left:14px;
  }

  .palette{
    display:grid;
    grid-template-columns:repeat(3, 42px);
    gap:6px;
    justify-content:center;
    background:#f7f3ff;
    border:2px dashed #e3d9fb;
    border-radius:14px;
    padding:6px;
    flex-shrink:0;
  }
  .palette-block{
    width:42px; height:42px;
    font-size:19px;
    border:3px solid var(--sky-dark);
    background:#fff;
    border-radius:12px;
    cursor:grab;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 var(--sky-dark);
    user-select:none;
  }
  .palette-block[data-type="coin"]{ border-color:var(--gold); box-shadow:0 3px 0 var(--gold); }
  .palette-block[data-type="jump"]{ border-color:var(--grape); box-shadow:0 3px 0 var(--grape); }
  .palette-block.dragging{ opacity:.35; }
  .palette-block:active{ cursor:grabbing; }

  .program-tray{
    min-height:40px;
    max-height:15vh;
    overflow-y:auto;
    width:100%;
    border:3px dashed var(--card-edge);
    border-radius:12px;
    background:#fffaf1;
    padding:6px;
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    align-content:flex-start;
    transition:background .12s, border-color .12s;
    flex-shrink:0;
  }
  .program-tray.dragover{ background:#eef7ff; border-color:var(--sky-dark); border-style:solid; }
  .program-tray .step{
    width:28px; height:28px;
    border-radius:8px;
    background:#fff;
    border:2px solid var(--sky-dark);
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    cursor:pointer;
    position:relative;
  }
  .program-tray .step[data-type="coin"]{ border-color:var(--gold); }
  .program-tray .step[data-type="jump"]{ border-color:var(--grape); }
  .program-tray .step.running{ background:var(--sun); border-color:#e0a800; }
  .program-tray .step.ok{ background:var(--ok-bg); border-color:var(--ok); }
  .program-tray .step.fail{ background:var(--bad-bg); border-color:var(--bad); border-width:3px; animation:shake .4s; }
  .program-tray .step.fail:after{
    content:"❌";
    position:absolute; top:-10px; right:-7px;
    font-size:12px;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-4px); }
    40%{ transform:translateX(4px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
  }
  .program-tray .empty-hint{ font-size:18px; padding:6px; opacity:.35; }

  .action-buttons{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; flex-shrink:0; }
  button.big-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:12px;
    border:none;
    border-radius:999px;
    padding:7px 12px;
    cursor:pointer;
    color:#fff;
    box-shadow:0 3px 0 rgba(0,0,0,0.15);
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .btn-run{ background:var(--mint); }
  .btn-reset{ background:var(--sky-dark); }
  .btn-clear{ background:var(--coral); }
  .btn-next{ background:var(--grape); display:none; }
  button.big-btn:active{ transform:translateY(2px); box-shadow:none; }
  button.big-btn:disabled{ opacity:.5; cursor:default; }

  .msg{
    font-size:18px;
    text-align:center;
    min-height:22px;
    flex-shrink:0;
  }

  .win-overlay{
    position:fixed; inset:0;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(58,43,82,0.55);
    z-index:999;
  }
  .win-overlay.show{ display:flex; }
  .win-box{
    background:#fff;
    border-radius:28px;
    padding:32px 40px;
    text-align:center;
    box-shadow:0 10px 0 var(--card-edge);
  }
  .win-box .big-emoji{ font-size:64px; }
  .win-box button{ margin-top:14px; }

  @media (max-height:600px){
    h1{font-size:16px;}
    .subtitle{display:none;}
    .legend{display:none;}
  }

  /* telas estreitas: barra lateral vira faixa embaixo do labirinto, e o
     tile encolhe um pouco (mas continua igual em TODAS as fases) */
  @media (max-width:700px){
    .game-card{ flex-direction:column; overflow-y:auto; overflow-x:hidden; }
    .stage-left{ flex:none; overflow:visible; }
    .controls{
      width:100%; max-width:420px; margin:0 auto;
      border-left:none; border-top:3px dashed var(--card-edge);
      padding-left:0; padding-top:10px;
    }
    :root{ --cell-size:36px; }
  }
  @media (max-width:420px){
    :root{ --cell-size:28px; }
  }
</style>
<script src="./progress.js"></script>
</head>
<body>
<div class="wrap" id="page-content" style="display:none;">

  <button id="lang-toggle-btn" style="position:fixed;top:10px;right:10px;z-index:999;font-size:20px;background:var(--card);border:2px solid var(--card-edge);border-radius:50%;width:38px;height:38px;cursor:pointer;box-shadow:0 3px 0 var(--card-edge);" onclick="toggleLang()" title="English">🇺🇸</button>
  <div class="back-row">
    <a href="./index.html" class="back-home">← Voltar</a>
    <span id="progress-badge-mount"></span>
  </div>

  <header>
    <h1>🤖 → ⭐</h1>
    <p class="subtitle" id="t-subtitle">Leve o robô até a estrela!</p>
    <p class="fase-atual-label" id="fase-atual-label"></p>
  </header>

  <div class="legend">
    <div class="li">⬆️⬇️⬅️➡️ <small id="t-legend-andar">ANDAR</small></div>
    <div class="li">🪙 <small id="t-legend-pegar">PEGAR</small></div>
    <div class="li">🦘 <small id="t-legend-pular">PULAR</small></div>
  </div>

  <div class="levels-strip" id="levels-strip"></div>

  <div class="game-card">
    <div class="stage-left">
      <div id="maze"></div>
      <div class="coin-status" id="coin-status"></div>
    </div>

    <div class="controls">
      <div class="palette" id="palette">
        <div class="palette-block" draggable="true" data-type="move" data-dir="up">⬆️</div>
        <div class="palette-block" draggable="true" data-type="move" data-dir="left">⬅️</div>
        <div class="palette-block" draggable="true" data-type="move" data-dir="down">⬇️</div>
        <div class="palette-block" draggable="true" data-type="move" data-dir="right">➡️</div>
        <div class="palette-block" draggable="true" data-type="coin">🪙</div>
        <div class="palette-block" draggable="true" data-type="jump">🦘</div>
      </div>

      <div class="program-tray" id="tray"></div>

      <div class="action-buttons">
        <button class="big-btn btn-run" id="btn-run" onclick="runProgram()">▶️ Play</button>
        <button class="big-btn btn-reset" id="t-btn-reset" onclick="reiniciarTentativa()">🔁 Reiniciar</button>
        <button class="big-btn btn-clear" id="t-btn-clear" onclick="clearProgram()">🗑️ Limpar</button>
        <button class="big-btn btn-next" id="btn-next-inline" onclick="irProximaFase()">➡️ Próximo</button>
      </div>

      <div class="msg" id="msg"></div>
    </div>
  </div>

</div>

<div class="win-overlay" id="win-overlay">
  <div class="win-box">
    <div class="big-emoji">🎉⭐🎉</div>
    <button class="big-btn btn-next" style="display:inline-flex;" onclick="closeWinOverlay()" id="win-btn">➡️ Próximo</button>
  </div>
</div>

<script>
// x = coluna (0 = esquerda), y = linha (0 = topo)
// walls = árvore (bloqueia sempre) · rocks = pedra (precisa pular) · coins = moedas a coletar
const levels = [
  {cols:3, rows:1, start:[0,0], goal:[2,0]},
  {cols:1, rows:3, start:[0,0], goal:[0,2]},
  {cols:3, rows:1, start:[2,0], goal:[0,0]},
  {cols:3, rows:3, start:[0,0], goal:[2,2]},
  {cols:4, rows:3, start:[0,0], goal:[3,2]},

  {cols:4, rows:1, start:[0,0], goal:[3,0], coins:[[2,0]]},
  {cols:1, rows:4, start:[0,0], goal:[0,3], coins:[[0,1]]},
  {cols:4, rows:3, start:[0,0], goal:[3,2], coins:[[3,0]], walls:[[0,2]]},
  {cols:4, rows:4, start:[0,0], goal:[3,3], coins:[[3,0],[3,2]], walls:[[0,3]]},
  {cols:5, rows:1, start:[0,0], goal:[4,0], coins:[[1,0],[3,0]]},

  {cols:4, rows:1, start:[0,0], goal:[3,0], rocks:[[2,0]]},
  {cols:1, rows:4, start:[0,0], goal:[0,3], rocks:[[0,2]]},
  {cols:5, rows:1, start:[0,0], goal:[4,0], rocks:[[2,0]], coins:[[3,0]]},
  {cols:1, rows:5, start:[0,0], goal:[0,4], rocks:[[0,2]], coins:[[0,3]]},
  {cols:6, rows:1, start:[0,0], goal:[5,0], rocks:[[2,0],[4,0]]},

  {cols:4, rows:4, start:[0,0], goal:[3,3], rocks:[[3,1]], coins:[[3,0]], walls:[[1,2]]},
  {cols:5, rows:4, start:[0,0], goal:[4,3], rocks:[[4,2]], coins:[[4,0],[4,3]], walls:[[1,1]]},
  {cols:6, rows:4, start:[0,0], goal:[5,3], rocks:[[5,2]], coins:[[1,0],[5,3]], walls:[[2,1],[2,2]]},
  {cols:5, rows:4, start:[0,0], goal:[4,0], walls:[[2,0],[2,1],[2,2]]},
  {cols:5, rows:4, start:[0,0], goal:[4,3], rocks:[[2,3]], coins:[[0,3],[4,3]], walls:[[2,0],[2,1]]},

  {cols:6, rows:5, start:[0,0], goal:[5,4], coins:[[5,0],[5,4]], walls:[[2,2]]},
  {cols:6, rows:5, start:[0,0], goal:[5,4], rocks:[[5,2]], coins:[[5,4]], walls:[]},
  {cols:7, rows:1, start:[0,0], goal:[6,0], rocks:[[2,0],[5,0]]},
  {cols:1, rows:7, start:[0,0], goal:[0,6], rocks:[[0,2],[0,5]]},
  {cols:6, rows:5, start:[0,0], goal:[5,4], rocks:[[5,2]], coins:[[5,0],[5,4]], walls:[[1,3],[3,3]]},
  {cols:7, rows:5, start:[0,0], goal:[6,4], walls:[[3,0],[3,1],[3,2],[3,3]]},
  {cols:7, rows:1, start:[0,0], goal:[6,0], rocks:[[5,0]], coins:[[6,0]], walls:[[3,0]]},
  {cols:6, rows:6, start:[0,0], goal:[5,5], rocks:[[4,5]], coins:[[0,5],[5,5]], walls:[[2,0],[2,1],[2,2],[2,3],[2,4]]},
  {cols:7, rows:6, start:[0,0], goal:[6,5], walls:[[3,1],[3,2],[1,4]]},
  {cols:7, rows:6, start:[0,0], goal:[6,5], rocks:[[3,5]], coins:[[0,5],[6,5]], walls:[[3,1],[3,2]]}
];

let currentLang = 'pt';
const UI_STRINGS = {
  pt: { subtitle:'Leve o robô até a estrela!', andar:'ANDAR', pegar:'PEGAR', pular:'PULAR',
        reiniciar:'🔁 Reiniciar', limpar:'🗑️ Limpar', proximo:'➡️ Próximo', fim:'🏆 Fim!',
        bateuParede:'❌ Esse bloco bateu na parede', naoSabePulo:'❌ Esse bloco não sabe pra onde pular',
        pulouErrado:'❌ Esse bloco pulou pro lugar errado', chegou:'🎉 Você chegou!',
        faltaMoeda:'🪙 Falta pegar moeda', quaseEstrela:'🤔 Quase! Faltou chegar na estrela' },
  en: { subtitle:'Get the robot to the star!', andar:'MOVE', pegar:'GRAB', pular:'JUMP',
        reiniciar:'🔁 Reset', limpar:'🗑️ Clear', proximo:'➡️ Next', fim:'🏆 Done!',
        bateuParede:'❌ That block hit the wall', naoSabePulo:"❌ That block doesn't know which way to jump",
        pulouErrado:'❌ That block jumped to the wrong spot', chegou:'🎉 You made it!',
        faltaMoeda:'🪙 Still need a coin', quaseEstrela:"🤔 Almost! Didn't reach the star" }
};
function toggleLang(){
  currentLang = currentLang === 'pt' ? 'en' : 'pt';
  applyLang();
}
function applyLang(){
  const t = UI_STRINGS[currentLang];
  document.getElementById('t-subtitle').textContent = t.subtitle;
  document.getElementById('t-legend-andar').textContent = t.andar;
  document.getElementById('t-legend-pegar').textContent = t.pegar;
  document.getElementById('t-legend-pular').textContent = t.pular;
  document.getElementById('t-btn-reset').textContent = t.reiniciar;
  document.getElementById('t-btn-clear').textContent = t.limpar;
  document.getElementById('btn-next-inline').textContent = t.proximo;
  document.getElementById('lang-toggle-btn').textContent = currentLang==='pt' ? '🇺🇸' : '🇧🇷';
  document.getElementById('lang-toggle-btn').title = currentLang==='pt' ? 'English' : 'Português';
}

const STORAGE_KEY = 'overcast_labirinto_v1';
let currentLevel = 0;
let program = [];
let pos = [0,0];
let lastDir = null;
let coinsCollected = new Set();
let completed = new Set();

const DIR_ICON = {up:'⬆️', down:'⬇️', left:'⬅️', right:'➡️'};
const DELTA = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

function saveProgress(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    completed:[...completed],
    lastLevel: currentLevel
  }));
  if(window.OvercastProgress){
    OvercastProgress.saveProgress('labirinto1', { completed:[...completed], lastLevel: currentLevel });
  }
}
async function syncCloudProgress(){
  if(!window.OvercastProgress) return;
  const cloud = await OvercastProgress.loadProgress('labirinto1');
  if(cloud && Array.isArray(cloud.completed)){
    let changed = false;
    cloud.completed.forEach(n => { if(!completed.has(n)){ completed.add(n); changed = true; } });
    if(typeof cloud.lastLevel === 'number' && cloud.lastLevel > currentLevel){ currentLevel = cloud.lastLevel; changed = true; }
    if(currentLevel > maxUnlocked()) currentLevel = maxUnlocked();
    if(changed){
      buildLevelsStrip();
      loadLevel();
      saveProgress();
    }
  }
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    completed = new Set(data.completed || []);
    if(typeof data.lastLevel === 'number') currentLevel = data.lastLevel;
  }catch(e){}
}
function maxUnlocked(){
  let n = 0;
  while(completed.has(n)) n++;
  return Math.min(n, levels.length - 1);
}

function buildLevelsStrip(){
  const strip = document.getElementById('levels-strip');
  const unlocked = maxUnlocked();
  strip.innerHTML = levels.map((_, i) => {
    const isLocked = i > unlocked;
    return `<div class="level-dot ${isLocked ? 'locked' : ''}" id="dot-${i}" onclick="${isLocked ? '' : `goToLevel(${i})`}">${isLocked ? '🔒' : (i+1)}</div>`;
  }).join('');
  updateDots();
}

function updateDots(){
  levels.forEach((_, i) => {
    const dot = document.getElementById('dot-'+i);
    if(!dot) return;
    dot.classList.toggle('active', i === currentLevel);
    dot.classList.toggle('done', completed.has(i));
  });
  const label = document.getElementById('fase-atual-label');
  if(label) label.textContent = `🚩 Fase ${currentLevel + 1} de ${levels.length}`;
  const activeDot = document.getElementById('dot-' + currentLevel);
  if(activeDot) activeDot.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

function goToLevel(i){
  if(i > maxUnlocked()) return;
  currentLevel = i;
  saveProgress();
  loadLevel();
}

function levelData(){ return levels[currentLevel]; }

function loadLevel(){
  const lvl = levelData();
  pos = [...lvl.start];
  lastDir = null;
  program = [];
  coinsCollected = new Set();
  document.getElementById('msg').textContent = '';
  document.getElementById('btn-next-inline').style.display = 'none';
  renderMaze();
  renderTray();
  renderCoinStatus();
  updateDots();
}

function isTree(x,y){ return (levelData().walls||[]).some(w=>w[0]===x&&w[1]===y); }
function isRock(x,y){ return (levelData().rocks||[]).some(w=>w[0]===x&&w[1]===y); }
function isCoinCell(x,y){ return (levelData().coins||[]).some(c=>c[0]===x&&c[1]===y); }
function coinKey(x,y){ return x+','+y; }

function renderMaze(){
  const lvl = levelData();
  const maze = document.getElementById('maze');
  maze.style.gridTemplateColumns = `repeat(${lvl.cols}, var(--cell-size, 44px))`;
  maze.style.gridTemplateRows = `repeat(${lvl.rows}, var(--cell-size, 44px))`;

  let html = '';
  for(let y=0; y<lvl.rows; y++){
    for(let x=0; x<lvl.cols; x++){
      const tree = isTree(x,y);
      const rock = isRock(x,y);
      const isGoal = x===lvl.goal[0] && y===lvl.goal[1];
      const isChar = x===pos[0] && y===pos[1];
      const hasCoin = isCoinCell(x,y) && !coinsCollected.has(coinKey(x,y));

      let cls = 'cell';
      if(tree) cls += ' tree';
      else if(rock) cls += ' rock';
      else if(isGoal && !isChar) cls += ' goal';
      if(isChar) cls += ' char';

      let content = '';
      if(tree) content = '🌳';
      else if(rock) content = '🪨';
      else if(isChar) content = '<span class="robot" id="robot">🤖</span>';
      else if(isGoal) content = '⭐';

      if(hasCoin && !isChar) content += '<span class="coin-mark">🪙</span>';

      html += `<div class="${cls}" id="cell-${x}-${y}">${content}</div>`;
    }
  }
  maze.innerHTML = html;
}

function renderCoinStatus(){
  const lvl = levelData();
  const total = (lvl.coins || []).length;
  const el = document.getElementById('coin-status');
  if(total === 0){ el.innerHTML = ''; return; }
  el.innerHTML = `🪙 ${coinsCollected.size}/${total}`;
}

function renderTray(){
  const tray = document.getElementById('tray');
  if(program.length === 0){
    tray.innerHTML = '<span class="empty-hint">🖐️</span>';
    return;
  }
  tray.innerHTML = program.map((step, i) => {
    const icon = step.type === 'move' ? DIR_ICON[step.dir] : (step.type === 'jump' ? '🦘' : '🪙');
    return `<div class="step" data-type="${step.type}" id="step-${i}" onclick="removeStep(${i})">${icon}</div>`;
  }).join('');
}

function addStep(step){
  if(program.length >= 30) return;
  program.push(step);
  renderTray();
}
function removeStep(i){
  program.splice(i,1);
  renderTray();
}
function undoStep(){
  program.pop();
  renderTray();
}
function clearProgram(){
  program = [];
  renderTray();
  reiniciarTentativa();
}
function reiniciarTentativa(){
  const lvl = levelData();
  pos = [...lvl.start];
  lastDir = null;
  coinsCollected = new Set();
  document.getElementById('msg').textContent = '';
  document.getElementById('btn-next-inline').style.display = 'none';
  document.querySelectorAll('.program-tray .step').forEach(s=>s.classList.remove('running','ok','fail'));
  renderMaze();
  renderCoinStatus();
}

let draggedStep = null;

document.querySelectorAll('.palette-block').forEach(block=>{
  block.addEventListener('dragstart', e=>{
    draggedStep = block.dataset.type === 'move'
      ? { type:'move', dir: block.dataset.dir }
      : { type: block.dataset.type };
    block.classList.add('dragging');
  });
  block.addEventListener('dragend', ()=>block.classList.remove('dragging'));
});

const trayEl = document.getElementById('tray');
trayEl.addEventListener('dragover', e=>{
  e.preventDefault();
  trayEl.classList.add('dragover');
});
trayEl.addEventListener('dragleave', ()=>trayEl.classList.remove('dragover'));
trayEl.addEventListener('drop', e=>{
  e.preventDefault();
  trayEl.classList.remove('dragover');
  if(draggedStep) addStep(draggedStep);
  draggedStep = null;
});

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function runProgram(){
  const lvl = levelData();
  const runBtn = document.getElementById('btn-run');
  const msg = document.getElementById('msg');
  msg.textContent = '';
  runBtn.disabled = true;

  pos = [...lvl.start];
  lastDir = null;
  coinsCollected = new Set();
  renderMaze();
  renderCoinStatus();
  await sleep(250);

  function checkWin(){
    const total = (lvl.coins || []).length;
    return pos[0]===lvl.goal[0] && pos[1]===lvl.goal[1] && coinsCollected.size >= total;
  }

  for(let i=0; i<program.length; i++){
    document.querySelectorAll('.program-tray .step').forEach(s=>s.classList.remove('running'));
    const stepEl = document.getElementById('step-'+i);
    if(stepEl) stepEl.classList.add('running');
    const step = program[i];

    if(step.type === 'move'){
      lastDir = step.dir;
      const [dx,dy] = DELTA[step.dir];
      const nx = pos[0]+dx, ny = pos[1]+dy;
      const outOfBounds = nx<0 || ny<0 || nx>=lvl.cols || ny>=lvl.rows;

      if(outOfBounds || isTree(nx,ny)){
        const cell = document.getElementById(`cell-${pos[0]}-${pos[1]}`);
        if(cell) cell.classList.add('bump');
        if(stepEl) stepEl.classList.add('fail');
        msg.textContent = UI_STRINGS[currentLang].bateuParede;
        runBtn.disabled = false;
        return;
      }
      if(isRock(nx,ny)){
        const cell = document.getElementById(`cell-${pos[0]}-${pos[1]}`);
        if(cell) cell.classList.add('bump');
        await sleep(300);
      } else {
        pos = [nx, ny];
        renderMaze();
        if(stepEl) stepEl.classList.add('ok');
        await sleep(350);
      }
    }

    else if(step.type === 'jump'){
      if(!lastDir){
        if(stepEl) stepEl.classList.add('fail');
        msg.textContent = UI_STRINGS[currentLang].naoSabePulo;
        await sleep(250);
        runBtn.disabled = false;
        return;
      } else {
        const [dx,dy] = DELTA[lastDir];
        const nx = pos[0]+dx*2, ny = pos[1]+dy*2;
        const outOfBounds = nx<0 || ny<0 || nx>=lvl.cols || ny>=lvl.rows;
        if(outOfBounds || isTree(nx,ny) || isRock(nx,ny)){
          const cell = document.getElementById(`cell-${pos[0]}-${pos[1]}`);
          if(cell) cell.classList.add('bump');
          if(stepEl) stepEl.classList.add('fail');
          msg.textContent = UI_STRINGS[currentLang].pulouErrado;
          runBtn.disabled = false;
          return;
        }
        pos = [nx, ny];
        renderMaze();
        const cell = document.getElementById(`cell-${pos[0]}-${pos[1]}`);
        if(cell) cell.classList.add('hop');
        if(stepEl) stepEl.classList.add('ok');
        await sleep(400);
      }
    }

    else if(step.type === 'coin'){
      if(isCoinCell(pos[0], pos[1]) && !coinsCollected.has(coinKey(pos[0], pos[1]))){
        coinsCollected.add(coinKey(pos[0], pos[1]));
        renderCoinStatus();
        const cell = document.getElementById(`cell-${pos[0]}-${pos[1]}`);
        if(cell) cell.classList.add('sparkle');
        if(stepEl) stepEl.classList.add('ok');
      }
      await sleep(280);
    }

    if(checkWin()){
      const cell = document.getElementById(`cell-${pos[0]}-${pos[1]}`);
      if(cell) cell.classList.add('win');
      completed.add(currentLevel);
      saveProgress();
      buildLevelsStrip();
      msg.textContent = UI_STRINGS[currentLang].chegou;
      document.getElementById('btn-next-inline').style.display = 'inline-flex';
      await sleep(300);
      showWinOverlay();
      runBtn.disabled = false;
      return;
    }
  }

  const total = (lvl.coins || []).length;
  msg.textContent = coinsCollected.size < total ? UI_STRINGS[currentLang].faltaMoeda : UI_STRINGS[currentLang].quaseEstrela;
  runBtn.disabled = false;
}

function showWinOverlay(){
  const isLast = currentLevel >= levels.length - 1;
  document.getElementById('win-btn').innerHTML = isLast ? UI_STRINGS[currentLang].fim : UI_STRINGS[currentLang].proximo;
  document.getElementById('win-overlay').classList.add('show');
}
function irProximaFase(){
  closeWinOverlay();
}
function closeWinOverlay(){
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('btn-next-inline').style.display = 'none';
  if(currentLevel < levels.length - 1){
    currentLevel++;
    saveProgress();
    loadLevel();
  } else {
    loadLevel();
  }
}

loadProgress();
if(currentLevel > maxUnlocked()) currentLevel = maxUnlocked();
buildLevelsStrip();
loadLevel();
applyLang();

if(window.OvercastProgress){
  OvercastProgress.mountBadge(document.getElementById('progress-badge-mount'));
  OvercastProgress.onLink(identity => { if(identity) syncCloudProgress(); });
  if(OvercastProgress.getIdentity()) syncCloudProgress();
}

CourseGate.protect({ cursos: ['games'], contentSelector: '#page-content' });
</script>
