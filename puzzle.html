<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle de Lógica — Overcast Realm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8ec;
    --sky:#5ec9ff;
    --sky-dark:#2fa8ec;
    --sun:#ffc93c;
    --coral:#ff7a6b;
    --mint:#3ddc97;
    --grape:#a06bff;
    --ink:#3a2b52;
    --ink-soft:#6b5b8a;
    --card:#ffffff;
    --card-edge:#f0e4d0;
    --ok:#2bb673;
    --ok-bg:#e3fbf0;
    --bad:#ff5c5c;
    --bad-bg:#ffecec;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 6%, #ffe9b8 0%, transparent 40%),
      radial-gradient(circle at 95% 15%, #bfeaff 0%, transparent 38%),
      radial-gradient(circle at 90% 95%, #d8f5e6 0%, transparent 40%),
      var(--bg);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    font-size:20px;
    min-height:100vh;
    padding:20px 14px 70px;
  }
  .wrap{max-width:1100px;margin:0 auto;}

  header{
    text-align:center;
    margin-bottom:22px;
  }
  .eyebrow{
    display:inline-block;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    color:#fff;
    background:var(--grape);
    padding:6px 18px;
    border-radius:999px;
    letter-spacing:0.5px;
    margin-bottom:14px;
    box-shadow:0 3px 0 #7d4fd6;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:38px;
    line-height:1.15;
    margin:0 0 10px;
    color:var(--sky-dark);
    text-shadow:3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff;
  }
  h1 .em{color:var(--coral);}
  header p{
    color:var(--ink-soft);
    font-size:20px;
    font-weight:700;
    margin:0;
    max-width:560px;
    margin:0 auto;
  }

  .progress-bar-wrap{
    max-width:520px;
    margin:22px auto 6px;
    background:var(--card);
    border:3px solid var(--card-edge);
    border-radius:999px;
    padding:6px;
    box-shadow:0 4px 0 var(--card-edge);
  }
  .progress-bar{
    height:22px;
    border-radius:999px;
    background:linear-gradient(90deg, var(--mint), var(--sky-dark));
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    color:var(--ink-soft);
    font-size:16px;
    margin-bottom:26px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:20px;
  }

  .exercise{
    background:var(--card);
    border:3px solid var(--card-edge);
    border-radius:22px;
    box-shadow:0 6px 0 var(--card-edge);
    padding:18px 18px 20px;
    position:relative;
  }
  .num-badge{
    position:absolute;
    top:-16px;
    left:16px;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:15px;
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    box-shadow:0 3px 0 rgba(0,0,0,0.15);
  }
  .c0{background:var(--sky-dark);}
  .c1{background:var(--coral);}
  .c2{background:var(--mint);}
  .c3{background:var(--grape);}

  .ex-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:19px;
    margin:8px 0 8px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .ex-title .icon{font-size:24px;}

  .scenario{
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:17px;
    color:var(--ink);
    background:#fff4de;
    border:2px dashed var(--sun);
    border-radius:14px;
    padding:10px 14px;
    margin-bottom:16px;
    line-height:1.35;
  }
  .scenario b{color:var(--coral);}

  .board{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .col{flex:1;min-width:170px;}
  .col-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    margin-bottom:8px;
    padding:3px 10px;
    border-radius:8px;
    display:inline-block;
  }
  .col-label.cond{background:#e3f4ff;color:var(--sky-dark);}
  .col-label.act{background:#ffe3ee;color:var(--coral);}

  .block{
    cursor:grab;
    user-select:none;
    background:#fff;
    border:2px solid var(--card-edge);
    border-radius:12px;
    padding:9px 11px;
    margin-bottom:8px;
    font-size:15px;
    font-weight:700;
    line-height:1.3;
    color:var(--ink);
    box-shadow:0 3px 0 var(--card-edge);
    transition:transform .1s, border-color .15s, box-shadow .1s;
  }
  .block[data-group="cond"]{border-color:#bfe4ff;}
  .block[data-group="act"]{border-color:#ffd0e0;}
  .block:active{cursor:grabbing;}
  .block:hover{transform:translateY(-2px);}
  .block.dragging{opacity:0.3;}
  .block.placed{
    opacity:0.3;
    pointer-events:none;
    box-shadow:none;
  }

  .connectors{
    flex:1.3;
    min-width:180px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:8px;
  }
  .conn-row{
    display:flex;
    align-items:stretch;
    gap:6px;
  }
  .slot{
    flex:1;
    min-height:56px;
    background:#fbf9f4;
    border:2px dashed #d8cdb8;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px;
    font-size:14.5px;
    font-weight:700;
    color:#b8ac93;
    transition:border-color .15s, background .15s;
  }
  .slot.dragover{border-color:var(--grape);background:#f2e9ff;}
  .slot.filled{
    border-style:solid;
    color:var(--ink);
    background:#fff;
  }
  .slot.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}
  .slot.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);}
  .arrow{
    align-self:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    color:var(--grape);
    font-size:20px;
  }

  .actions-row{
    margin-top:14px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }
  button{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:9px 16px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    transition:transform .08s;
  }
  button.primary{
    background:var(--mint);
    color:#fff;
    box-shadow:0 4px 0 #299f6e;
  }
  button.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #299f6e;}
  button.secondary{
    background:#fff;
    color:var(--ink-soft);
    border:2px solid var(--card-edge);
    box-shadow:0 4px 0 var(--card-edge);
  }
  button.secondary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--card-edge);}

  .feedback{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--ink-soft);
    min-height:18px;
  }
  .feedback.ok{color:var(--ok);}
  .feedback.bad{color:var(--bad);}

  footer{
    text-align:center;
    margin-top:44px;
    color:var(--ink-soft);
    font-size:16px;
    font-weight:700;
  }

  @media (max-width:760px){
    .grid{grid-template-columns:1fr;}
    body{font-size:18px;}
    h1{font-size:28px;}
    .board{flex-direction:column;}
  }

  .back-home {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
    background: var(--card);
    border: 3px solid var(--card-edge);
    border-radius: 999px;
    padding: 8px 16px;
    text-decoration: none;
    box-shadow: 0 4px 0 var(--card-edge);
    margin-bottom: 18px;
  }
  .back-home:hover { color: var(--sky-dark); }
</style>
<script src="./progress.js"></script>
</head>

  {icon:"⏳", title:{pt:"Tempo esgotado",en:"Time's up"}, scenario:{pt:'Se o <b>tempo chegar a 0</b>, o sistema reinicia o layout.', en:'If <b>Time reaches 0</b>, the system restarts the layout.'},

  {icon:"🚪", title:{pt:"Porta",en:"Door"}, scenario:{pt:'Se o personagem <b>colidir com a porta</b>, o sistema vai para o layout seguinte.', en:'If the Player <b>collides with the Door</b>, the system goes to the next layout.'},

  {icon:"🔁", title:{pt:"Reiniciar manual",en:"Manual restart"}, scenario:{pt:'Se for pressionada a tecla <b>"R"</b>, o sistema reinicia o layout.', en:'If the <b>"R"</b> key is down, the system restarts the layout.'},
   cond:[['Teclado: tecla "R" pressionada','Keyboard: "R" is down',true],["Teclado: tecla Espaço pressionada","Keyboard: Space is down",false]],
   act:[["Sistema reinicia o layout","System: Restart layout",true],["Personagem atira","Player: Shoot",false]]},
  {icon:"✨", title:{pt:"Estrela",en:"Star"}, scenario:{pt:'Se o personagem <b>colidir com a estrela</b>, aumenta 1 na contagem de estrelas.', en:'If the Player <b>collides with the Star</b>, add 1 to the star count.'},
   cond:[["Personagem colide com a Estrela","Player: On collision with Star",true],["Personagem colide com a Moeda","Player: On collision with Coin",false]],

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const grid = document.getElementById('grid');
const blockTextPT = {};
const blockTextEN = {};

exercises.forEach((ex, idx)=>{
  const n = idx+1;
  const condShuffled = shuffle(ex.cond.map((c,i)=>({pt:c[0], en:c[1], correct:c[2], id:'c'+n+'_'+i})));
  const actShuffled = shuffle(ex.act.map((a,i)=>({pt:a[0], en:a[1], correct:a[2], id:'a'+n+'_'+i})));
  const correctCondId = condShuffled.find(c=>c.correct).id;
  const correctActId = actShuffled.find(a=>a.correct).id;

  const colorClass = ['c0','c1','c2','c3'][idx % 4];

  const section = document.createElement('section');
  section.className = 'exercise';
  section.innerHTML = `
    <div class="num-badge ${colorClass}">${n}</div>
    <div class="ex-title"><span class="icon">${ex.icon}</span> <span class="t-title" data-ex="${n}">${ex.title.pt}</span></div>
    <div class="scenario"><span class="t-scenario" data-ex="${n}">${ex.scenario.pt}</span></div>
    <div class="board" data-exercise="${n}">
      <div class="col">
        <div class="col-label cond t-se">SE</div>
        ${condShuffled.map(c=>`<div class="block" draggable="true" data-id="${c.id}" data-group="cond">${c.pt}</div>`).join('')}
        <div class="col-label act t-entao" style="margin-top:10px;">ENTÃO</div>
        ${actShuffled.map(a=>`<div class="block" draggable="true" data-id="${a.id}" data-group="act">${a.pt}</div>`).join('')}
      </div>
      <div class="connectors">
        <div class="conn-row">
          <div class="slot t-se-dots" data-accepts="cond" data-correct="${correctCondId}">SE...</div>
          <div class="arrow">➔</div>
          <div class="slot t-entao-dots" data-accepts="act" data-correct="${correctActId}">ENTÃO...</div>
        </div>
      </div>
    </div>
    <div class="actions-row">
      <button class="primary t-conferir" onclick="checkExercise(${n})">✅ Conferir</button>
      <button class="secondary t-limpar" onclick="resetExercise(${n})">🔄 Limpar</button>
      <span class="feedback" id="fb-${n}"></span>
    </div>
  `;
  grid.appendChild(section);

  condShuffled.forEach(c=>{ blockTextPT[c.id]=c.pt; blockTextEN[c.id]=c.en; });
  actShuffled.forEach(a=>{ blockTextPT[a.id]=a.pt; blockTextEN[a.id]=a.en; });
});

function blockText(id){ return currentLang==='pt' ? blockTextPT[id] : blockTextEN[id]; }

function toggleLang(){
  currentLang = currentLang === 'pt' ? 'en' : 'pt';
  applyLang();
}
function applyLang(){
  const t = UI_STRINGS[currentLang];
  document.getElementById('t-eyebrow').textContent = t.eyebrow;
  document.getElementById('t-h1').innerHTML = t.h1;
  document.getElementById('t-sub').textContent = t.sub;
  document.getElementById('t-footer').textContent = t.footer;
  document.getElementById('lang-toggle-btn').textContent = currentLang==='pt' ? '🇺🇸' : '🇧🇷';
  document.getElementById('lang-toggle-btn').title = currentLang==='pt' ? 'English' : 'Português';

  exercises.forEach((ex,idx) => {
    const n = idx+1;
    document.querySelectorAll(`.t-title[data-ex="${n}"]`).forEach(el => el.textContent = ex.title[currentLang]);
    document.querySelectorAll(`.t-scenario[data-ex="${n}"]`).forEach(el => el.innerHTML = ex.scenario[currentLang]);
  });
  document.querySelectorAll('.t-se').forEach(el => el.textContent = t.se);
  document.querySelectorAll('.t-entao').forEach(el => el.textContent = t.entao);
  document.querySelectorAll('.t-conferir').forEach(el => el.textContent = t.conferir);
  document.querySelectorAll('.t-limpar').forEach(el => el.textContent = t.limpar);

  // blocos ainda no monte (não usados) e slots já preenchidos: atualiza o texto sem embaralhar de novo
  document.querySelectorAll('.block').forEach(b => { b.textContent = blockText(b.dataset.id); });
  document.querySelectorAll('.slot').forEach(slot => {
    if(slot.dataset.filledId){
      slot.textContent = blockText(slot.dataset.filledId);
    } else {
      slot.textContent = slot.classList.contains('t-se-dots') ? t.seDots : t.entaoDots;
    }
  });

  updateProgress();
}

let dragged = null;
const solved = new Set();
const STORAGE_KEY = 'overcast_puzzle1_v1';

function saveProgress(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ solved:[...solved] }));
  if(window.OvercastProgress){
    OvercastProgress.saveProgress('puzzle1', { solved:[...solved] });
  }
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    (data.solved||[]).forEach(n => solved.add(n));
  }catch(e){}
}
async function syncCloudProgress(){
  if(!window.OvercastProgress) return;
  const cloud = await OvercastProgress.loadProgress('puzzle1');
  if(cloud && Array.isArray(cloud.solved)){
    let changed = false;
    cloud.solved.forEach(n => { if(!solved.has(n)){ solved.add(n); changed = true; } });
    if(changed){
      solved.forEach(n => {
        const board = document.querySelector('.board[data-exercise="'+n+'"]');
        const fb = document.getElementById('fb-'+n);
        if(fb){ fb.textContent = UI_STRINGS[currentLang].certinhoSalvo; fb.className = 'feedback ok'; }
      });
      updateProgress();
      saveProgress();
    }
  }
}

function attachHandlers(){
  document.querySelectorAll('.block').forEach(block=>{
    block.addEventListener('dragstart', e=>{
      if(block.classList.contains('placed')) { e.preventDefault(); return; }
      dragged = block;
      block.classList.add('dragging');
      e.dataTransfer.setData('text/plain', block.dataset.id);
    });
    block.addEventListener('dragend', ()=>block.classList.remove('dragging'));
  });

  document.querySelectorAll('.slot').forEach(slot=>{
    slot.addEventListener('dragover', e=>{
      e.preventDefault();
      if(!dragged) return;
      if(dragged.dataset.group !== slot.dataset.accepts) return;
      slot.classList.add('dragover');
    });
    slot.addEventListener('dragleave', ()=>slot.classList.remove('dragover'));
    slot.addEventListener('drop', e=>{
      e.preventDefault();
      slot.classList.remove('dragover');
      if(!dragged) return;
      if(dragged.dataset.group !== slot.dataset.accepts) return;

      if(slot.dataset.filledId){
        const prev = document.querySelector('[data-id="'+slot.dataset.filledId+'"]');
        if(prev) prev.classList.remove('placed');
      }

      slot.dataset.filledId = dragged.dataset.id;
      slot.textContent = blockText(dragged.dataset.id);
      slot.classList.add('filled');
      slot.classList.remove('correct','wrong');
      dragged.classList.add('placed');
      dragged = null;
    });
  });
}
attachHandlers();

function updateProgress(){
  const total = exercises.length;
  const done = solved.size;
  document.getElementById('progress-bar').style.width = (done/total*100)+'%';
  document.getElementById('progress-label').textContent = UI_STRINGS[currentLang].progresso(done);
}

function checkExercise(n){
  const t = UI_STRINGS[currentLang];
  const board = document.querySelector('.board[data-exercise="'+n+'"]');
  const slots = board.querySelectorAll('.slot');
  let allFilled = true;
  let allCorrect = true;

  slots.forEach(slot=>{
    if(!slot.dataset.filledId){ allFilled = false; return; }
    slot.classList.remove('correct','wrong');
    if(slot.dataset.filledId === slot.dataset.correct){
      slot.classList.add('correct');
    } else {
      slot.classList.add('wrong');
      allCorrect = false;
    }
  });

  const fb = document.getElementById('fb-'+n);

  if(!allFilled){
    fb.textContent = t.preencha;
    fb.className = 'feedback bad';
    return;
  }
  if(allCorrect){
    fb.textContent = t.certinho;
    fb.className = 'feedback ok';
    solved.add(n);
  } else {
    fb.textContent = t.quase;
    fb.className = 'feedback bad';
    solved.delete(n);
  }
  updateProgress();
  saveProgress();
}

function resetExercise(n){
  const t = UI_STRINGS[currentLang];
  const board = document.querySelector('.board[data-exercise="'+n+'"]');
  board.querySelectorAll('.slot').forEach(slot=>{
    const label = slot.dataset.accepts === 'cond' ? t.seDots : t.entaoDots;
    slot.textContent = label;
    slot.classList.remove('filled','correct','wrong');
    delete slot.dataset.filledId;
  });
  board.querySelectorAll('.block').forEach(b=>b.classList.remove('placed'));
  const fb = document.getElementById('fb-'+n);
  fb.textContent = '';
  fb.className = 'feedback';
  solved.delete(n);
  updateProgress();
  saveProgress();
}

loadProgress();
updateProgress();

if(window.OvercastProgress){
  OvercastProgress.mountBadge(document.getElementById('progress-badge-mount'));
  OvercastProgress.onLink(identity => { if(identity) syncCloudProgress(); });
  if(OvercastProgress.getIdentity()) syncCloudProgress();
}

CourseGate.protect({ cursos: ['games'], contentSelector: '#page-content' });
</script>
